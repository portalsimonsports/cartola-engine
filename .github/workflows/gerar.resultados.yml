name: Gerar Resultados Live

on:
  repository_dispatch:
    types:
      - cartola_live_publish
  workflow_dispatch:
    inputs:
      payload_json:
        description: "Payload JSON manual; deixe vazio para reutilizar data/payload_dispatch.json"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

# IMPORTANTE:
# Publicações diferentes não podem compartilhar o mesmo grupo, porque o GitHub
# mantém apenas uma execução pendente por grupo. Quando vários cards chegam em
# sequência, uma execução pendente anterior pode ser cancelada antes de iniciar.
# O grupo abaixo separa evento e modelo de time. Para LIVE_PONTUACAO_TIME sem
# modelo explícito, usa o payload_hash para preservar os três cards individuais.
concurrency:
  group: gerar-resultados-live-${{ github.ref }}-${{ github.event.client_payload.payload.evento_programado || github.event.client_payload.evento_programado || github.event.client_payload.tipo_publicacao || github.event_name }}-${{ github.event.client_payload.payload.tipo_time || github.event.client_payload.payload.modelo || github.event.client_payload.payload.tipo || ((github.event.client_payload.payload.evento_programado == 'LIVE_PONTUACAO_TIME') && github.event.client_payload.payload_hash) || github.event.client_payload.payload.contexto || github.event.client_payload.contexto || 'geral' }}
  cancel-in-progress: false

jobs:
  gerar-resultados-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade -r requirements.txt

      - name: Validar renderizadores aprovados
        shell: bash
        run: |
          set -e
          python -m py_compile app/render_telegram_cards.py
          python -m py_compile app/gerar_resultados_telegram.py
          python -m py_compile app/render_live_cards_v2.py
          python -m py_compile app/render_live_cards_v3.py
          python -m py_compile app/render_live_cards_v4.py
          python -m py_compile app/render_live_aux_v1.py
          python -m py_compile app/render_live_cobertura_v2.py
          python -m py_compile app/render_live_cobertura_v3.py
          python -m py_compile app/render_live_cards_v5.py
          python -m py_compile app/render_notice_cards.py
          python -m py_compile app/render_aprovadas_v1.py
          python -m py_compile app/render_mercado_aberto_v2.py
          python -m py_compile app/publicar_desempenho_times_abertura.py
          python -m py_compile app/gerar_resultados_telegram_v3.py
          echo "Renderizadores aprovados validados."

      - name: Preparar e validar payload
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ github.event.inputs.payload_json }}
        run: |
          set -e
          mkdir -p data output

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            printf '%s' "$DISPATCH_PAYLOAD" > data/payload_dispatch.json
            echo "Payload Live recebido automaticamente."
          elif [ -n "$MANUAL_PAYLOAD" ]; then
            printf '%s' "$MANUAL_PAYLOAD" > data/payload_dispatch.json
            echo "Payload Live manual informado."
          elif [ -s data/payload_dispatch.json ]; then
            echo "Reutilizando data/payload_dispatch.json existente."
          else
            echo "ERRO: execução manual sem payload e sem arquivo salvo."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/payload_dispatch.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(payload, dict):
              raise SystemExit("ERRO: payload precisa ser um objeto JSON.")

          evento = str(payload.get("evento_github", "") or "").strip()
          origem = str(payload.get("origem", "") or "").strip()
          destino = str(payload.get("workflow_destino", "") or "").strip()

          if evento and evento != "cartola_live_publish":
              raise SystemExit(f"ERRO: evento_github incorreto: {evento}")
          if destino and destino != "gerar.resultados.yml":
              raise SystemExit(f"ERRO: workflow_destino incorreto: {destino}")
          if origem and not any(token in origem.lower() for token in ("live", "cronograma", "ciclo")):
              raise SystemExit(f"ERRO: origem incorreta para o pipeline de imagens: {origem}")

          inner = payload.get("payload") if isinstance(payload.get("payload"), dict) else payload
          tipo = str(payload.get("tipo_publicacao") or inner.get("tipo_publicacao") or "")
          contexto = str(payload.get("contexto") or inner.get("contexto") or "")
          evento_programado = str(payload.get("evento_programado") or inner.get("evento_programado") or "")
          print(f"Payload validado: evento={evento_programado}; tipo={tipo}; contexto={contexto}")
          PY

          rm -f output/live_*.png output/resultados_*.png output/boletim_*.png
          rm -f output/aprovada_*.png output/ultima_publicacao.json

      - name: Aplicar cadência das parciais Live
        shell: bash
        run: |
          set -e
          git fetch origin main >/dev/null 2>&1 || true

          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          payload = json.loads(Path("data/payload_dispatch.json").read_text(encoding="utf-8"))
          inner = payload.get("payload") if isinstance(payload.get("payload"), dict) else payload
          evento = str(
              inner.get("evento_programado")
              or payload.get("evento_programado")
              or inner.get("tipo_publicacao")
              or payload.get("tipo_publicacao")
              or ""
          ).strip().upper()

          try:
              rodada = int(float(inner.get("rodada") or payload.get("rodada") or 0))
          except Exception:
              rodada = 0

          regras = {
              "LIVE_MITOS_ZICAS": (15, f"output/live_mitos_zicas_rodada_{rodada}.png"),
              "LIVE_RANKING_PARCIAL": (15, f"output/live_parciais_rodada_{rodada}.png"),
              "LIVE_RESUMO_TIMES": (15, f"output/live_parciais_rodada_{rodada}.png"),
          }

          regra = regras.get(evento)
          if not regra or rodada <= 0:
              raise SystemExit(0)

          limite_min, arquivo = regra
          try:
              saida = subprocess.check_output(
                  ["git", "log", "origin/main", "-1", "--format=%ct", "--", arquivo],
                  text=True,
              ).strip()
              ultimo = int(saida) if saida else 0
          except Exception:
              ultimo = 0

          if not ultimo:
              raise SystemExit(0)

          diff_min = (time.time() - ultimo) / 60.0
          if diff_min >= limite_min:
              raise SystemExit(0)

          restante = max(1, int(limite_min - diff_min + 0.999))
          print(
              f"Cadência GitHub: {evento} não será republicado agora; "
              f"faltam aproximadamente {restante} min."
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write("PSS_SKIP_PUBLICACAO=1\n")
          PY

      - name: Gerar e publicar imagens aprovadas
        if: env.PSS_SKIP_PUBLICACAO != '1'
        shell: bash
        env:
          PAYLOAD_FILE: data/payload_dispatch.json
          OUTPUT_DIR: output
          TZ: America/Sao_Paulo
          PLANILHA_ID: ${{ secrets.PLANILHA_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          ABA_TELEGRAM: ${{ secrets.ABA_TELEGRAM }}
          CONTA_TELEGRAM: ${{ secrets.CONTA_TELEGRAM }}
          TELEGRAM_CHAT_FALLBACK: "@dicascartolaportalsimonsports"
        run: |
          set -e
          python app/gerar_resultados_telegram_v3.py

      - name: Validar imagens aprovadas geradas
        if: env.PSS_SKIP_PUBLICACAO != '1'
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("output/ultima_publicacao.json")
          if not manifest.exists():
              raise SystemExit("ERRO: manifesto não gerado.")

          data = json.loads(manifest.read_text(encoding="utf-8"))
          if data.get("versao_visual") != "approved_cards_v1":
              raise SystemExit("ERRO: pipeline approved_cards_v1 não utilizado.")
          if data.get("base_visual") != "approved_cards_v1_2026_07_27":
              raise SystemExit("ERRO: base visual aprovada incorreta.")

          publications = data.get("publicacoes") or []
          if not publications:
              raise SystemExit("ERRO: nenhuma publicação foi registrada.")

          files = [
              path
              for publication in publications
              for path in publication.get("arquivos", [])
          ]
          if not files:
              raise SystemExit("ERRO: nenhuma imagem foi gerada.")

          missing = [path for path in files if not Path(path).exists()]
          if missing:
              raise SystemExit(f"ERRO: arquivos ausentes: {missing}")

          forbidden = [path for path in files if "boletim_" in Path(path).name]
          if forbidden:
              raise SystemExit(f"ERRO: boletim textual/genérico bloqueado: {forbidden}")

          print(
              f"Base aprovada validada: {len(publications)} publicação(ões), "
              f"{len(files)} card(s)."
          )
          PY
          ls -lh output || true

      - name: Publicar arquivos gerados no repositório
        if: env.PSS_SKIP_PUBLICACAO != '1' && success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/publicacoes_atuais/ \
            output/*.png 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Sem alterações permanentes para commit."
            exit 0
          fi

          git commit -m "Telegram: imagens aprovadas do cronograma completo"
          git reset --hard HEAD
          git clean -fd

          enviado=0
          for tentativa in 1 2 3 4 5; do
            echo "Tentativa de push $tentativa/5"
            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD
            git clean -fd
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                enviado=1
                break
              fi
            fi

            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD
            sleep $((tentativa * 3))
          done

          if [ "$enviado" -ne 1 ]; then
            echo "ERRO: não foi possível publicar o commit após 5 tentativas."
            exit 1
          fi

          echo "Commit publicado com sucesso no branch main."
