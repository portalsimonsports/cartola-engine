name: Gerar Resultados Live

on:
  repository_dispatch:
    types:
      - cartola_live_publish
  workflow_dispatch:
    inputs:
      payload_json:
        description: "Payload JSON manual; deixe vazio para reutilizar data/payload_dispatch.json"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: gerar-resultados-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gerar-resultados-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade -r requirements.txt

      - name: Validar renderizador e base visual aprovada
        shell: bash
        run: |
          set -e
          python -m py_compile app/render_telegram_cards.py
          python -m py_compile app/gerar_resultados_telegram.py
          python -m py_compile app/render_live_cards_v2.py
          python -m py_compile app/render_live_cards_v3.py
          python -m py_compile app/render_live_cards_v4.py
          python -m py_compile app/gerar_resultados_telegram_v2.py
          echo "Renderizador Live V4 premium validado."

      - name: Preparar e validar payload
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ github.event.inputs.payload_json }}
        run: |
          set -e
          mkdir -p data output

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            printf '%s' "$DISPATCH_PAYLOAD" > data/payload_dispatch.json
            echo "Payload Live recebido automaticamente."
          elif [ -n "$MANUAL_PAYLOAD" ]; then
            printf '%s' "$MANUAL_PAYLOAD" > data/payload_dispatch.json
            echo "Payload Live manual informado."
          elif [ -s data/payload_dispatch.json ]; then
            echo "Reutilizando data/payload_dispatch.json existente."
          else
            echo "ERRO: execução manual sem payload e sem arquivo salvo."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/payload_dispatch.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(payload, dict):
              raise SystemExit("ERRO: payload precisa ser um objeto JSON.")

          evento = str(payload.get("evento_github", "") or "").strip()
          origem = str(payload.get("origem", "") or "").strip()
          destino = str(payload.get("workflow_destino", "") or "").strip()

          if evento and evento != "cartola_live_publish":
              raise SystemExit(f"ERRO: evento_github incorreto: {evento}")
          if destino and destino != "gerar.resultados.yml":
              raise SystemExit(f"ERRO: workflow_destino incorreto: {destino}")
          if origem and "live" not in origem.lower():
              raise SystemExit(f"ERRO: origem incorreta para o Live Publisher: {origem}")

          inner = payload.get("payload") if isinstance(payload.get("payload"), dict) else payload
          tipo = str(payload.get("tipo_publicacao") or inner.get("tipo_publicacao") or "")
          contexto = str(payload.get("contexto") or inner.get("contexto") or "")
          print(f"Payload Live validado: tipo={tipo}; contexto={contexto}")
          PY

          rm -f output/live_*.png
          rm -f output/resultados_*.png output/boletim_*.png
          rm -f output/ultima_publicacao.json

      - name: Gerar e publicar cards com a base visual aprovada
        shell: bash
        env:
          PAYLOAD_FILE: data/payload_dispatch.json
          OUTPUT_DIR: output
          TZ: America/Sao_Paulo
          PLANILHA_ID: ${{ secrets.PLANILHA_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          ABA_TELEGRAM: ${{ secrets.ABA_TELEGRAM }}
          CONTA_TELEGRAM: ${{ secrets.CONTA_TELEGRAM }}
          TELEGRAM_CHAT_FALLBACK: "@dicascartolaportalsimonsports"
        run: |
          set -e
          python app/gerar_resultados_telegram_v2.py

      - name: Validar cards profissionais gerados
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("output/ultima_publicacao.json")
          if not manifest.exists():
              raise SystemExit("ERRO: manifesto não gerado.")

          data = json.loads(manifest.read_text(encoding="utf-8"))
          if data.get("versao_visual") != "live_cards_v4":
              raise SystemExit("ERRO: o renderizador Live V4 não foi utilizado.")

          base_esperada = "live_cards_v4_premium_square_2026_07_26"
          if data.get("base_visual") != base_esperada:
              raise SystemExit(
                  "ERRO: base visual diferente da versão V4 aprovada: "
                  + repr(data.get("base_visual"))
              )

          publications = data.get("publicacoes") or []
          if not publications:
              raise SystemExit("ERRO: nenhuma publicação foi registrada.")

          invalid = [
              publication
              for publication in publications
              if publication.get("tipo_detectado") in ("bulletin", "results", "results_v2", "results_v3")
          ]
          if invalid:
              raise SystemExit(
                  "ERRO: boletim genérico ou renderizador antigo detectado: "
                  + repr(invalid)
              )

          files = [
              path
              for publication in publications
              for path in publication.get("arquivos", [])
          ]
          if not files:
              raise SystemExit("ERRO: nenhuma arte Live V4 foi gerada.")

          missing = [path for path in files if not Path(path).exists()]
          if missing:
              raise SystemExit(f"ERRO: arquivos ausentes: {missing}")

          placeholders = [
              path for path in files
              if "boletim_" in Path(path).name or "resultados_rodada" in Path(path).name
          ]
          if placeholders:
              raise SystemExit(f"ERRO: arquivos genéricos bloqueados: {placeholders}")

          print(
              f"Base visual V4 validada: {len(publications)} publicação(ões), "
              f"{len(files)} card(s)."
          )
          PY
          ls -lh output || true

      - name: Publicar arquivos gerados no repositório
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ output/ || true

          if git diff --cached --quiet; then
            echo "Sem alterações para commit."
            exit 0
          fi

          git commit -m "Telegram: cards Live V4 premium"
          git pull --rebase origin main || true
          git push origin HEAD:main
