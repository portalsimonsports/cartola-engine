name: Gerar Resultados Live

on:
  repository_dispatch:
    types:
      - cartola_live_publish
  workflow_dispatch:
    inputs:
      payload_json:
        description: "Payload JSON manual para teste"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: gerar-resultados-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gerar-resultados-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade -r requirements.txt

      - name: Preparar e validar payload
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ github.event.inputs.payload_json }}
        run: |
          set -e
          mkdir -p data output

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            printf '%s' "$DISPATCH_PAYLOAD" > data/payload_dispatch.json
          else
            if [ -z "$MANUAL_PAYLOAD" ]; then
              echo "ERRO: execução manual sem payload_json."
              exit 1
            fi
            printf '%s' "$MANUAL_PAYLOAD" > data/payload_dispatch.json
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/payload_dispatch.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(payload, dict):
              raise SystemExit("ERRO: payload precisa ser um objeto JSON.")

          evento = str(payload.get("evento_github", "") or "").strip()
          origem = str(payload.get("origem", "") or "").strip()
          destino = str(payload.get("workflow_destino", "") or "").strip()

          if evento and evento != "cartola_live_publish":
              raise SystemExit(f"ERRO: evento_github incorreto: {evento}")
          if destino and destino != "gerar.resultados.yml":
              raise SystemExit(f"ERRO: workflow_destino incorreto: {destino}")
          if origem and "live" not in origem.lower():
              raise SystemExit(f"ERRO: origem incorreta para o Live Publisher: {origem}")

          print("Payload Live validado.")
          PY

      - name: Publicar resultados no Telegram
        shell: bash
        env:
          PAYLOAD_FILE: data/payload_dispatch.json
          TZ: America/Sao_Paulo
          PLANILHA_ID: ${{ secrets.PLANILHA_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          ABA_TELEGRAM: ${{ secrets.ABA_TELEGRAM }}
          CONTA_TELEGRAM: ${{ secrets.CONTA_TELEGRAM }}
          TELEGRAM_CHAT_FALLBACK: "@dicascartolaportalsimonsports"
        run: |
          set -e
          python app/publicar_telegram_com_fallback.py

      - name: Publicar arquivos gerados no repositório
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ output/ || true

          if git diff --cached --quiet; then
            echo "Sem alterações para commit."
            exit 0
          fi

          git commit -m "Live Publisher: geração de resultados e resumos"
          git pull --rebase origin main || true
          git push origin HEAD:main
