name: Disparar Vídeo Inicial

on:
  workflow_run:
    workflows:
      - Gerar Times e Top5
    types:
      - completed
  workflow_dispatch:
  push:
    paths:
      - 'data/flags/video_inicial_solicitar_rodada_*.json'

permissions:
  contents: write

concurrency:
  group: cartola-video-inicial
  cancel-in-progress: false

jobs:
  detectar:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.detectar.outputs.ready }}
      rodada: ${{ steps.detectar.outputs.rodada }}
    steps:
      - name: Checkout main com histórico
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detectar seleção inicial confirmada e vídeo ainda não publicado
        id: detectar
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          base = Path('data/publicacoes_atuais')
          flags_dir = Path('data/flags')
          out = Path(os.environ['GITHUB_OUTPUT'])

          def load(path):
              try:
                  d = json.loads(path.read_text(encoding='utf-8'))
                  return d if isinstance(d, dict) else {}
              except Exception:
                  return {}

          def rows(d):
              v = d.get('jogadores') or d.get('atletas') or d.get('dados') or d.get('lista') or []
              return [x for x in v if isinstance(x, dict)]

          def git_json(c, p):
              r = subprocess.run(['git', 'show', f'{c}:{p}'], text=True, capture_output=True)
              if r.returncode != 0 or not r.stdout.strip():
                  return {}
              try:
                  d = json.loads(r.stdout)
                  return d if isinstance(d, dict) else {}
              except Exception:
                  return {}

          def has_snapshot(rel, rodada, minimo):
              d = load(Path(rel))
              if int(d.get('rodada') or 0) == rodada and len(rows(d)) >= minimo:
                  return True
              for c in subprocess.run(['git', 'log', '--format=%H', '--all', '--', rel], text=True, capture_output=True).stdout.splitlines():
                  d = git_json(c, rel)
                  if int(d.get('rodada') or 0) == rodada and len(rows(d)) >= minimo:
                      return True
              return False

          def selecao_confirmada(rodada):
              flag = load(flags_dir / f'publicacao_SELECAO_INICIAL_rodada_{rodada}_PACOTE.json')
              return (
                  str(flag.get('status') or '').upper() == 'PUBLICADO_COM_SUCESSO'
                  and str(flag.get('evento_programado') or '').upper() == 'SELECAO_INICIAL'
                  and int(flag.get('rodada') or 0) == rodada
              )

          def publicado(rodada):
              flag = load(flags_dir / f'video_inicial_rodada_{rodada}.publicado.json')
              return str(flag.get('status') or '').upper() == 'PUBLICADO_COM_SUCESSO'

          # A rodada-alvo vem da confirmação REAL da Seleção Inicial.
          rodadas = []
          for path in flags_dir.glob('publicacao_SELECAO_INICIAL_rodada_*_PACOTE.json'):
              m = re.search(r'rodada_(\d+)_PACOTE\.json$', path.name)
              if not m:
                  continue
              r = int(m.group(1))
              if selecao_confirmada(r):
                  rodadas.append(r)

          if not rodadas:
              out.write_text('ready=false\n', encoding='utf-8')
              print('Nenhuma Seleção Inicial confirmada por marker real.')
              raise SystemExit(0)

          rodada = max(set(rodadas))
          print(f'Seleção Inicial confirmada: R{rodada}.')

          if publicado(rodada):
              out.write_text(f'ready=false\nrodada={rodada}\n', encoding='utf-8')
              print(f'Vídeo de análise inicial R{rodada} já publicado com sucesso.')
              raise SystemExit(0)

          req = {
              f'data/publicacoes_atuais/time_economico_rodada_{rodada}.json': 12,
              f'data/publicacoes_atuais/time_intermediario_rodada_{rodada}.json': 12,
              f'data/publicacoes_atuais/time_pontuacao_rodada_{rodada}.json': 12,
              f'data/publicacoes_atuais/top5_rodada_{rodada}.json': 30,
          }

          faltando = []
          for rel, minimo in req.items():
              if not has_snapshot(rel, rodada, minimo):
                  faltando.append(f'{rel} (mínimo={minimo})')

          if not faltando:
              out.write_text(f'ready=true\nrodada={rodada}\n', encoding='utf-8')
              print(f'Vídeo de análise inicial R{rodada} LIBERADO: Seleção Inicial confirmada + 3 times + Top5 disponíveis.')
          else:
              out.write_text(f'ready=false\nrodada={rodada}\n', encoding='utf-8')
              print(f'R{rodada} com Seleção Inicial confirmada, mas snapshots incompletos: {faltando}')
          PY

  publicar:
    needs: detectar
    if: needs.detectar.outputs.ready == 'true'
    uses: ./.github/workflows/publicar.video.cartola.yml
    with:
      rodada: ${{ needs.detectar.outputs.rodada }}
      fase: INICIAL
    secrets: inherit
