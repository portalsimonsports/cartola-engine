name: Disparar Vídeo Inicial

on:
  workflow_run:
    workflows:
      - Gerar Times e Top5
    types:
      - completed
  push:
    branches: [main]
    paths:
      - 'data/publicacoes_atuais/time_economico_rodada_*.json'
      - 'data/publicacoes_atuais/time_intermediario_rodada_*.json'
      - 'data/publicacoes_atuais/time_pontuacao_rodada_*.json'
      - 'data/publicacoes_atuais/top5_rodada_*.json'
      - '.github/workflows/disparar.video.inicial.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: cartola-video-inicial-guard
  cancel-in-progress: false

jobs:
  verificar-e-disparar:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main com histórico
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detectar seleção inicial completa e ainda não publicada
        id: detectar
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          base = Path('data/publicacoes_atuais')
          out = Path(os.environ['GITHUB_OUTPUT'])

          def load(path):
              try:
                  d = json.loads(path.read_text(encoding='utf-8'))
                  return d if isinstance(d, dict) else {}
              except Exception:
                  return {}

          def rows(d):
              v = d.get('jogadores') or d.get('atletas') or d.get('dados') or d.get('lista') or []
              return [x for x in v if isinstance(x, dict)]

          def git_json(commit, rel):
              p = subprocess.run(['git','show',f'{commit}:{rel}'], text=True, capture_output=True)
              if p.returncode != 0 or not p.stdout.strip():
                  return {}
              try:
                  d = json.loads(p.stdout)
                  return d if isinstance(d, dict) else {}
              except Exception:
                  return {}

          def has_snapshot(rel, rodada, minimo):
              d = load(Path(rel))
              if int(d.get('rodada') or 0) == rodada and str(d.get('evento_programado') or '').upper() == 'SELECAO_INICIAL' and len(rows(d)) >= minimo:
                  return True
              commits = subprocess.run(['git','log','--format=%H','--all','--',rel], text=True, capture_output=True).stdout.splitlines()
              for c in commits:
                  d = git_json(c, rel)
                  if int(d.get('rodada') or 0) == rodada and str(d.get('evento_programado') or '').upper() == 'SELECAO_INICIAL' and len(rows(d)) >= minimo:
                      return True
              return False

          rodadas = []
          for path in base.glob('top5_rodada_*.json'):
              m = re.search(r'rodada_(\d+)\.json$', path.name)
              if m:
                  rodadas.append(int(m.group(1)))

          for rodada in sorted(set(rodadas), reverse=True):
              video = Path(f'output/analise_inicial_rodada_{rodada}.mp4')
              manifesto = Path(f'output/analise_inicial_rodada_{rodada}.json')
              flag = Path(f'data/flags/video_inicial_rodada_{rodada}.publicado.json')
              if video.exists() and manifesto.exists() and flag.exists():
                  continue

              req = {
                  f'data/publicacoes_atuais/time_economico_rodada_{rodada}.json': 12,
                  f'data/publicacoes_atuais/time_intermediario_rodada_{rodada}.json': 12,
                  f'data/publicacoes_atuais/time_pontuacao_rodada_{rodada}.json': 12,
                  f'data/publicacoes_atuais/top5_rodada_{rodada}.json': 30,
              }
              if all(has_snapshot(rel, rodada, minimo) for rel, minimo in req.items()):
                  with out.open('a', encoding='utf-8') as fh:
                      fh.write('ready=true\n')
                      fh.write(f'rodada={rodada}\n')
                  print(f'Análise inicial R{rodada} pronta e ainda não publicada.')
                  raise SystemExit(0)

          out.write_text('ready=false\n', encoding='utf-8')
          print('Nenhuma análise inicial pendente com snapshots completos.')
          PY

      - name: Executar Publicar Vídeo Cartola - Inicial
        if: steps.detectar.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RODADA: ${{ steps.detectar.outputs.rodada }}
        shell: bash
        run: |
          set -e
          gh workflow run publicar.video.cartola.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f rodada="$RODADA" \
            -f fase="INICIAL"
          echo "Publicar Vídeo Cartola acionado diretamente para INICIAL R${RODADA}."
