name: Disparar Vídeo Inicial

on:
  workflow_run:
    workflows:
      - Gerar Times e Top5
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: cartola-video-inicial-guard
  cancel-in-progress: false

jobs:
  verificar-e-disparar:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Detectar seleção inicial completa
        id: detectar
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          base = Path('data/publicacoes_atuais')

          def carregar(path):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
                  return data if isinstance(data, dict) else {}
              except Exception:
                  return {}

          def rows(payload):
              values = (
                  payload.get('jogadores')
                  or payload.get('atletas')
                  or payload.get('dados')
                  or payload.get('lista')
                  or []
              )
              return [item for item in values if isinstance(item, dict)]

          candidatos = []
          for path in base.glob('top5_rodada_*.json'):
              m = re.search(r'rodada_(\d+)\.json$', path.name)
              if not m:
                  continue
              data = carregar(path)
              if str(data.get('evento_programado') or '').upper() == 'SELECAO_INICIAL':
                  candidatos.append((int(m.group(1)), data))

          out = Path(os.environ['GITHUB_OUTPUT'])
          if not candidatos:
              with out.open('a', encoding='utf-8') as fh:
                  fh.write('ready=false\n')
              print('Nenhuma seleção inicial completa candidata.')
              raise SystemExit(0)

          rodada, top5 = max(candidatos, key=lambda item: item[0])
          problemas = []

          if int(top5.get('rodada') or 0) != rodada:
              problemas.append('top5: rodada incorreta')
          if len(rows(top5)) < 30:
              problemas.append(f'top5: {len(rows(top5))} registros')

          for nome in ('time_economico', 'time_intermediario', 'time_pontuacao'):
              path = base / f'{nome}_rodada_{rodada}.json'
              if not path.exists():
                  problemas.append(f'{nome}: ausente')
                  continue
              data = carregar(path)
              if int(data.get('rodada') or 0) != rodada:
                  problemas.append(f'{nome}: rodada incorreta')
              if str(data.get('evento_programado') or '').upper() != 'SELECAO_INICIAL':
                  problemas.append(f"{nome}: {data.get('evento_programado') or 'SEM_EVENTO'}")
              if len(rows(data)) < 12:
                  problemas.append(f'{nome}: {len(rows(data))} registros')

          marker = Path(f'data/flags/video_inicial_rodada_{rodada}.dispatchado.json')
          manifesto = Path(f'output/analise_inicial_rodada_{rodada}.json')

          if problemas:
              print('Seleção inicial ainda incompleta: ' + ' | '.join(problemas))
              with out.open('a', encoding='utf-8') as fh:
                  fh.write('ready=false\n')
              raise SystemExit(0)

          if marker.exists() or manifesto.exists():
              print(f'Vídeo inicial da rodada {rodada} já disparado ou concluído.')
              with out.open('a', encoding='utf-8') as fh:
                  fh.write('ready=false\n')
              raise SystemExit(0)

          with out.open('a', encoding='utf-8') as fh:
              fh.write('ready=true\n')
              fh.write(f'rodada={rodada}\n')
              fh.write(f'marker={marker.as_posix()}\n')
          print(f'Seleção inicial completa da rodada {rodada}; vídeo liberado.')
          PY

      - name: Disparar vídeo inicial
        if: steps.detectar.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RODADA: ${{ steps.detectar.outputs.rodada }}
        shell: bash
        run: |
          set -e
          payload="{\"event_type\":\"cartola_video_analise\",\"client_payload\":{\"rodada\":${RODADA},\"fase\":\"INICIAL\",\"origem\":\"guard_pos_selecao_inicial\"}}"
          codigo="$(curl -sS -o /tmp/resposta.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d "$payload")"
          cat /tmp/resposta.json || true
          if [ "$codigo" -lt 200 ] || [ "$codigo" -ge 300 ]; then
            echo "Falha ao disparar vídeo inicial: HTTP $codigo"
            exit 1
          fi
          echo "Vídeo INICIAL da rodada ${RODADA} disparado com HTTP ${codigo}."

      - name: Registrar disparo
        if: steps.detectar.outputs.ready == 'true' && success()
        env:
          RODADA: ${{ steps.detectar.outputs.rodada }}
          MARKER: ${{ steps.detectar.outputs.marker }}
        shell: bash
        run: |
          set -e
          mkdir -p "$(dirname "$MARKER")"
          printf '{\n  "rodada": %s,\n  "fase": "INICIAL",\n  "dispatch": "cartola_video_analise",\n  "origem": "guard_pos_selecao_inicial",\n  "registrado_em": "%s"\n}\n' \
            "$RODADA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$MARKER"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MARKER"
          git commit -m "Cartola: registrar vídeo inicial R${RODADA}"
          git pull --rebase origin main
          git push origin HEAD:main
