name: Disparar Vídeo Inicial

on:
  workflow_run:
    workflows:
      - Gerar Times e Top5
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: cartola-video-inicial-guard
  cancel-in-progress: false

jobs:
  verificar-e-disparar:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main com histórico
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Detectar seleção inicial completa e pendente
        id: detectar
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          base = Path('data/publicacoes_atuais')
          out = Path(os.environ['GITHUB_OUTPUT'])

          def load(path):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
                  return data if isinstance(data, dict) else {}
              except Exception:
                  return {}

          def rows(data):
              values = data.get('jogadores') or data.get('atletas') or data.get('dados') or data.get('lista') or []
              return [x for x in values if isinstance(x, dict)]

          def git_json(commit, path):
              p = subprocess.run(['git','show',f'{commit}:{path}'], text=True, capture_output=True)
              if p.returncode != 0 or not p.stdout.strip(): return {}
              try: return json.loads(p.stdout)
              except Exception: return {}

          candidatos = []
          for path in base.glob('top5_rodada_*.json'):
              m = re.search(r'rodada_(\d+)\.json$', path.name)
              if m: candidatos.append(int(m.group(1)))
          if not candidatos:
              out.write_text('ready=false\n', encoding='utf-8')
              raise SystemExit(0)

          rodada = max(candidatos)
          video = Path(f'output/analise_inicial_rodada_{rodada}.mp4')
          manifesto = Path(f'output/analise_inicial_rodada_{rodada}.json')
          sucesso = Path(f'data/flags/video_inicial_rodada_{rodada}.publicado.json')
          if video.exists() and manifesto.exists() and sucesso.exists():
              out.write_text('ready=false\n', encoding='utf-8')
              print(f'Vídeo inicial R{rodada} já publicado de fato.')
              raise SystemExit(0)

          required = {
              f'data/publicacoes_atuais/time_economico_rodada_{rodada}.json': 12,
              f'data/publicacoes_atuais/time_intermediario_rodada_{rodada}.json': 12,
              f'data/publicacoes_atuais/time_pontuacao_rodada_{rodada}.json': 12,
              f'data/publicacoes_atuais/top5_rodada_{rodada}.json': 30,
          }
          problemas = []
          for rel, minimo in required.items():
              data = load(Path(rel))
              ok = int(data.get('rodada') or 0) == rodada and str(data.get('evento_programado') or '').upper() == 'SELECAO_INICIAL' and len(rows(data)) >= minimo
              if not ok:
                  commits = subprocess.run(['git','log','--format=%H','--all','--',rel], text=True, capture_output=True).stdout.splitlines()
                  ok = any(int((d:=git_json(c,rel)).get('rodada') or 0) == rodada and str(d.get('evento_programado') or '').upper() == 'SELECAO_INICIAL' and len(rows(d)) >= minimo for c in commits)
              if not ok: problemas.append(rel)

          if problemas:
              out.write_text('ready=false\n', encoding='utf-8')
              print('Snapshot inicial incompleto: ' + ' | '.join(problemas))
              raise SystemExit(0)

          with out.open('a', encoding='utf-8') as fh:
              fh.write('ready=true\n')
              fh.write(f'rodada={rodada}\n')
          print(f'Vídeo inicial R{rodada} pendente; novo dispatch autorizado.')
          PY

      - name: Disparar vídeo inicial
        if: steps.detectar.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RODADA: ${{ steps.detectar.outputs.rodada }}
        shell: bash
        run: |
          set -e
          payload="{\"event_type\":\"cartola_video_analise\",\"client_payload\":{\"rodada\":${RODADA},\"fase\":\"INICIAL\",\"origem\":\"guard_pos_selecao_inicial_v2\"}}"
          codigo="$(curl -sS -o /tmp/resposta.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" -d "$payload")"
          cat /tmp/resposta.json || true
          test "$codigo" -ge 200 && test "$codigo" -lt 300
          echo "Dispatch INICIAL R${RODADA} aceito: HTTP ${codigo}."
