name: Ciclo Completo Cartola — DESATIVADO

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Digite SIM apenas após validação dos dados"
        required: true
        default: "NAO"
      rodada:
        description: "Rodada manual"
        required: false
        default: "0"

permissions:
  contents: read
  actions: read

jobs:
  bloqueado:
    if: ${{ github.event.inputs.confirmar != 'SIM' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Ciclo automático desativado para impedir publicações vazias ou incorretas."

  executar-manualmente:
    if: ${{ github.event.inputs.confirmar == 'SIM' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validar sem publicar
        run: |
          python -m py_compile app/cartola_ciclo_github.py
          echo "Execução automática permanece bloqueada. Este workflow não publica no Telegram."
