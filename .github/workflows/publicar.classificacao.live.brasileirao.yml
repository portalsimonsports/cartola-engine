name: Publicar Classificação Parcial ao Vivo do Brasileirão

on:
  repository_dispatch:
    types:
      - cartola_live_publish
  workflow_dispatch:
    inputs:
      payload_json:
        description: "Payload Live manual para diagnóstico"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: classificacao-live-brasileirao-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classificacao-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade -r requirements.txt

      - name: Preparar payload Live
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ github.event.inputs.payload_json }}
        run: |
          set -e
          mkdir -p data output
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            printf '%s' "$DISPATCH_PAYLOAD" > data/payload_classificacao_live.json
          elif [ -n "$MANUAL_PAYLOAD" ]; then
            printf '%s' "$MANUAL_PAYLOAD" > data/payload_classificacao_live.json
          else
            echo "Execução manual sem payload: nada a processar."
            printf '{}' > data/payload_classificacao_live.json
          fi

      - name: Validar scripts
        shell: bash
        run: |
          set -e
          python -m py_compile app/publicar_classificacao_brasileirao.py
          python -m py_compile app/publicar_classificacao_live_brasileirao.py
          python -m py_compile app/render_classificacao_brasileirao.py

      - name: Calcular e publicar classificação parcial
        shell: bash
        env:
          PAYLOAD_FILE: data/payload_classificacao_live.json
          CLASSIFICACAO_LIVE_STATE: data/publicacoes_atuais/classificacao_brasileirao_live_estado.json
          PLANILHA_CLASSIFICACAO_ID: 1-A7w4kkE28iHRd61yiSoNOvSekrmmADzHxGCRDVrICI
          ABA_CLASSIFICACAO: ESTATISTICAS_PROPRIA
          OUTPUT_DIR: output
          TZ: America/Sao_Paulo
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          PLANILHA_ID: ${{ secrets.PLANILHA_ID }}
          ABA_TELEGRAM: ${{ secrets.ABA_TELEGRAM }}
          CONTA_TELEGRAM: ${{ secrets.CONTA_TELEGRAM }}
          TELEGRAM_CHAT_FALLBACK: "@dicascartolaportalsimonsports"
        run: |
          set -e
          python app/publicar_classificacao_live_brasileirao.py

      - name: Salvar estado e imagem
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publicacoes_atuais/classificacao_brasileirao_live_estado.json 2>/dev/null || true
          git add output/classificacao_brasileirao_parcial_ao_vivo.png 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Sem mudança de classificação para salvar."
            exit 0
          fi

          git commit -m "Classificação: parcial ao vivo do Brasileirão"

          enviado=0
          for tentativa in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              enviado=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((tentativa * 3))
          done

          if [ "$enviado" -ne 1 ]; then
            echo "ERRO: não foi possível salvar o estado após 5 tentativas."
            exit 1
          fi
