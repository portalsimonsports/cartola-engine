name: Fallback Atualização 20h

on:
  schedule:
    - cron: '10 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cartola-times-top5-publicador-unico
  cancel-in-progress: false

jobs:
  garantir-publicacao-20h:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade -r requirements.txt

      - name: Validar mercado e preparar payload
        id: prep
        env:
          TZ: America/Sao_Paulo
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          mkdir -p data output data/flags
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import requests

          agora = datetime.now(ZoneInfo('America/Sao_Paulo'))
          output = Path(os.environ['GITHUB_OUTPUT'])

          def out(key, value):
              with output.open('a', encoding='utf-8') as fh:
                  fh.write(f'{key}={value}\n')

          def bloquear(msg):
              out('allowed', 'false')
              print(msg)
              raise SystemExit(0)

          # Só atua na janela da atualização das 20h.
          if agora.hour < 20 or agora.hour > 21:
              bloquear('Fora da janela da atualização das 20h.')

          # Confirma estado e data de fechamento diretamente na API oficial do Cartola.
          try:
              r = requests.get('https://api.cartola.globo.com/mercado/status', timeout=30)
              r.raise_for_status()
              st = r.json()
          except Exception as exc:
              raise SystemExit(f'ERRO consultando mercado/status: {exc}')

          rodada = int(st.get('rodada_atual') or st.get('rodada') or 0)
          status = int(st.get('status_mercado') or 0)
          fechamento = st.get('fechamento') or {}
          if isinstance(fechamento, dict):
              ano = fechamento.get('ano')
              mes = fechamento.get('mes')
              dia = fechamento.get('dia')
              dia_fechamento = f'{int(ano):04d}-{int(mes):02d}-{int(dia):02d}' if ano and mes and dia else ''
          else:
              dia_fechamento = ''

          hoje = agora.strftime('%Y-%m-%d')
          if status != 1 or rodada <= 0:
              bloquear(f'Mercado não está aberto. status={status} rodada={rodada}')
          if dia_fechamento and hoje == dia_fechamento:
              bloquear('Dia de fechamento: atualização das 20h não se aplica.')

          # PROTEÇÃO 1: marker persistido no repositório.
          marker = Path(f'data/flags/publicacao_ATUALIZACAO_20H_rodada_{rodada}_{hoje}_PACOTE.json')
          if marker.exists():
              bloquear(f'Atualização das 20h já registrada: {marker}')

          # PROTEÇÃO 2: deduplicação cruzada com o workflow normal gerar.yml.
          # O envio ao Telegram acontece ANTES do commit do marker. Se o envio tiver
          # sucesso e o commit/push posterior falhar, o marker não existe, mas a
          # publicação já ocorreu. O fallback deve detectar isso e NÃO repostar.
          token = os.environ.get('GITHUB_TOKEN', '').strip()
          repo = os.environ.get('GITHUB_REPOSITORY', '').strip()
          if not token or not repo:
              raise SystemExit('ERRO: credenciais GitHub indisponíveis para checagem anti-duplicidade.')

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          inicio_sp = agora.replace(hour=20, minute=0, second=0, microsecond=0)
          inicio_utc = inicio_sp.astimezone(timezone.utc)

          try:
              runs_url = f'https://api.github.com/repos/{repo}/actions/workflows/gerar.yml/runs'
              rr = requests.get(
                  runs_url,
                  headers=headers,
                  params={'branch': 'main', 'per_page': 30},
                  timeout=30,
              )
              rr.raise_for_status()
              runs = rr.json().get('workflow_runs') or []

              for run in runs:
                  created_raw = str(run.get('created_at') or '').strip()
                  try:
                      created = datetime.fromisoformat(created_raw.replace('Z', '+00:00'))
                  except Exception:
                      continue
                  if created < inicio_utc:
                      continue

                  run_id = int(run.get('id') or 0)
                  if not run_id:
                      continue

                  jobs_url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs'
                  jr = requests.get(jobs_url, headers=headers, params={'per_page': 100}, timeout=30)
                  jr.raise_for_status()

                  for job in jr.json().get('jobs') or []:
                      for step in job.get('steps') or []:
                          nome = str(step.get('name') or '').strip()
                          conclusao = str(step.get('conclusion') or '').strip().lower()
                          if nome == 'Gerar e publicar pacote aprovado' and conclusao == 'success':
                              criado_sp = created.astimezone(ZoneInfo('America/Sao_Paulo'))
                              bloquear(
                                  'Fallback bloqueado: o publicador normal já concluiu o passo de envio '
                                  f'hoje após 20h. run_id={run_id} | '
                                  f'run_status={run.get("status")} | run_conclusion={run.get("conclusion")} | '
                                  f'iniciado={criado_sp.strftime("%d/%m/%Y %H:%M:%S")}'
                              )
          except SystemExit:
              raise
          except Exception as exc:
              # Fail closed: se não for possível provar que não houve envio anterior,
              # não publica novamente. Evita duplicidade e perda de credibilidade.
              raise SystemExit(f'ERRO na checagem anti-duplicidade; fallback BLOQUEADO: {exc}')

          arquivos = [
              Path('data/times_atual_economico.json'),
              Path('data/times_atual_intermediario.json'),
              Path('data/times_atual_pontuacao.json'),
              Path('data/top5_atual.json'),
          ]
          for path in arquivos:
              if not path.exists():
                  raise SystemExit(f'ERRO: base ausente: {path}')
              d = json.loads(path.read_text(encoding='utf-8'))
              rbase = int(float(d.get('rodada') or d.get('RODADA') or 0))
              if rbase != rodada:
                  raise SystemExit(f'ERRO: {path} está na R{rbase}; mercado está na R{rodada}')

          payload = {
              'evento_programado': 'ATUALIZACAO_20H',
              'rodada': rodada,
              'tipo_publicacao': 'times',
              'modelo': 'ECONOMICO',
              'origem': 'fallback_20h_github',
              'forcar_envio': True,
          }
          Path('data/payload_dispatch.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          out('allowed', 'true')
          out('rodada', rodada)
          out('marker', marker.as_posix())
          print(f'Fallback autorizado: ATUALIZACAO_20H R{rodada}')
          PY

      - name: Publicar pacote completo das 20h
        if: steps.prep.outputs.allowed == 'true'
        env:
          PAYLOAD_FILE: data/payload_dispatch.json
          OUTPUT_DIR: output
          TZ: America/Sao_Paulo
          PLANILHA_ID: ${{ secrets.PLANILHA_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          ABA_TELEGRAM: ${{ secrets.ABA_TELEGRAM }}
          CONTA_TELEGRAM: ${{ secrets.CONTA_TELEGRAM }}
          TELEGRAM_CHAT_FALLBACK: '@dicascartolaportalsimonsports'
          EVENTO_PROGRAMADO: ATUALIZACAO_20H
        run: |
          set -e
          rm -f output/top5_*.png output/time_*.png output/resultados_*.png output/boletim_*.png output/ultima_publicacao.json
          python app/publicar_times_top5_automatico_v2.py

      - name: Validar e registrar pacote
        if: steps.prep.outputs.allowed == 'true' && success()
        env:
          RODADA: ${{ steps.prep.outputs.rodada }}
          MARKER: ${{ steps.prep.outputs.marker }}
        run: |
          set -e
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          m = Path('output/ultima_publicacao.json')
          if not m.exists():
              raise SystemExit('ERRO: manifesto ausente')
          pubs = json.loads(m.read_text(encoding='utf-8')).get('publicacoes') or []
          tipos = [str(p.get('tipo_publicacao') or '').lower() for p in pubs]
          esperado = {'time_economico','time_intermediario','time_pontuacao','top5'}
          if set(tipos) != esperado or len(tipos) != 4 or any(v > 1 for v in Counter(tipos).values()):
              raise SystemExit(f'ERRO: pacote incorreto: {tipos}')
          print(f'PACOTE 20H VALIDADO: {tipos}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p "$(dirname "$MARKER")"
          printf '{\n  "status": "PUBLICADO_COM_SUCESSO",\n  "evento_programado": "ATUALIZACAO_20H",\n  "rodada": %s,\n  "publicador": "FALLBACK_PACOTE_3_TIMES_TOP5",\n  "github_run_id": "%s",\n  "registrado_em": "%s"\n}\n' "$RODADA" "${{ github.run_id }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$MARKER"
          git add data/flags/ output/*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Telegram: garantir ATUALIZACAO_20H R${RODADA}"
          git pull --rebase origin main
          git push origin HEAD:main
