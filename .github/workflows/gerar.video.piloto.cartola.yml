name: Gerar Vídeo Piloto Cartola V2

on:
  push:
    branches:
      - main
    paths:
      - app/gerar_video_dialogo_cartola_v1.py
      - app/gerar_video_dialogo_cartola_v2.py
      - data/analise_tecnica_rodada_21_v2.json
      - .github/workflows/gerar.video.piloto.cartola.yml
  workflow_dispatch:
    inputs:
      rodada:
        description: "Rodada usada no piloto técnico"
        required: false
        default: "21"

permissions:
  contents: write

concurrency:
  group: gerar-video-piloto-cartola-v2
  cancel-in-progress: false

jobs:
  gerar-piloto-tecnico:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg, fontes e dependências
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          python -m pip install --upgrade pip
          python -m pip install edge-tts Pillow

      - name: Validar geradores, dados e imagens
        shell: bash
        run: |
          set -e
          python -m py_compile app/gerar_video_dialogo_cartola_v1.py
          python -m py_compile app/gerar_video_dialogo_cartola_v2.py
          for arquivo in \
            data/analise_tecnica_rodada_21_v2.json \
            data/publicacoes_atuais/time_economico_rodada_21.json \
            data/publicacoes_atuais/time_intermediario_rodada_21.json \
            data/publicacoes_atuais/time_pontuacao_rodada_21.json \
            data/publicacoes_atuais/top5_rodada_21.json \
            output/time_economico_rodada_21.png \
            output/time_intermediario_rodada_21.png \
            output/time_pontuacao_rodada_21.png \
            output/top5_rodada_21.png; do
              test -s "$arquivo" || { echo "Arquivo obrigatório ausente: $arquivo"; exit 1; }
          done

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/analise_tecnica_rodada_21_v2.json").read_text(encoding="utf-8"))
          if data.get("moeda_falada") != "cartoletas":
              raise SystemExit("A moeda falada precisa ser cartoletas.")
          if data.get("publicacao_automatica") is not False:
              raise SystemExit("O piloto não pode ser publicado automaticamente.")
          print("Dados técnicos e regra de pronúncia validados.")
          PY

      - name: Gerar MP4 técnico com Francisca, Antônio e Thalita
        shell: bash
        env:
          RODADA_MANUAL: ${{ github.event.inputs.rodada }}
        run: |
          set -e
          RODADA="${RODADA_MANUAL:-21}"
          rm -f "output/piloto_analise_tecnica_dialogada_rodada_${RODADA}_v2.mp4"
          rm -f "output/piloto_analise_tecnica_dialogada_rodada_${RODADA}_v2.json"
          python app/gerar_video_dialogo_cartola_v2.py \
            --rodada "$RODADA" \
            --repo-root . \
            --output "output/piloto_analise_tecnica_dialogada_rodada_${RODADA}_v2.mp4"

      - name: Validar vídeo e manifesto
        shell: bash
        run: |
          set -e
          VIDEO="$(find output -maxdepth 1 -type f -name 'piloto_analise_tecnica_dialogada_rodada_*_v2.mp4' | head -n 1)"
          MANIFESTO="${VIDEO%.mp4}.json"
          test -n "$VIDEO" && test -s "$VIDEO"
          test -s "$MANIFESTO"
          DURACAO="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          TAMANHO="$(stat -c%s "$VIDEO")"
          python - "$DURACAO" "$TAMANHO" "$MANIFESTO" <<'PY'
          import json
          import sys
          from pathlib import Path

          duration = float(sys.argv[1])
          size = int(sys.argv[2])
          manifest = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          if duration < 120 or duration > 420:
              raise SystemExit(f"Duração fora do esperado: {duration:.2f}s")
          if size < 500_000 or size > 120_000_000:
              raise SystemExit(f"Tamanho fora do esperado: {size} bytes")
          if manifest.get("moeda_falada") != "cartoletas":
              raise SystemExit("Manifesto sem confirmação de cartoletas.")
          texts = " ".join(item.get("texto_falado", "") for item in manifest.get("timeline", []))
          forbidden = ("dólar canadense", "dólares canadenses", "C$")
          if any(item.lower() in texts.lower() for item in forbidden):
              raise SystemExit("Pronúncia monetária incorreta detectada no roteiro.")
          expected_voices = {
              "pt-BR-FranciscaNeural",
              "pt-BR-AntonioNeural",
              "pt-BR-ThalitaMultilingualNeural",
          }
          if set(manifest.get("vozes", [])) != expected_voices:
              raise SystemExit("As três vozes aprovadas não foram preservadas.")
          print(f"Piloto V2 validado: duração={duration:.2f}s; tamanho={size/1024/1024:.2f} MiB")
          PY

      - name: Salvar piloto V2 no repositório
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/piloto_analise_tecnica_dialogada_rodada_*_v2.mp4
          git add output/piloto_analise_tecnica_dialogada_rodada_*_v2.json

          if git diff --cached --quiet; then
            echo "Piloto V2 já está atualizado."
            exit 0
          fi

          git commit -m "Vídeo piloto V2: análise técnica dialogada da Rodada 21"
          git reset --hard HEAD
          git clean -fd

          enviado=0
          for tentativa in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD
            git clean -fd
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              enviado=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((tentativa * 4))
          done

          if [ "$enviado" -ne 1 ]; then
            echo "Não foi possível publicar o piloto V2 após cinco tentativas."
            exit 1
          fi
