name: Recuperar e Publicar Vídeo de Pré-Fechamento

on:
  push:
    paths:
      - 'data/flags/forcar_video_pre_fechamento_*.json'

permissions:
  contents: write

concurrency:
  group: recuperar-publicar-video-pre-fechamento
  cancel-in-progress: false

jobs:
  recuperar-gerar-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Identificar rodada solicitada
        id: rodada
        run: |
          set -e
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          candidatos = []
          for path in Path('data/flags').glob('forcar_video_pre_fechamento_*.json'):
              m = re.search(r'pre_fechamento_(\d+)\.json$', path.name)
              if not m:
                  continue
              try:
                  payload = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  payload = {}
              rodada = int(payload.get('rodada') or m.group(1))
              candidatos.append((rodada, path))

          if not candidatos:
              raise SystemExit('Nenhum pedido de recuperação encontrado.')
          rodada, path = max(candidatos, key=lambda item: item[0])
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as fh:
              fh.write(f'rodada={rodada}\n')
          print(f'Recuperação solicitada para a rodada {rodada}: {path}')
          PY

      - name: Configurar Python e FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install edge-tts Pillow requests google-api-python-client google-auth

      - name: Recuperar snapshots e imagens do pré-fechamento
        env:
          RODADA: ${{ steps.rodada.outputs.rodada }}
        run: |
          set -e
          python -m py_compile app/gerar_base_video_por_fase.py
          python app/gerar_base_video_por_fase.py \
            --rodada "$RODADA" \
            --fase PRE_FECHAMENTO \
            --repo-root .
          test -s "data/analise_tecnica_rodada_${RODADA}_v3.json"
          test -s "output/time_economico_rodada_${RODADA}.png"
          test -s "output/time_intermediario_rodada_${RODADA}.png"
          test -s "output/time_pontuacao_rodada_${RODADA}.png"
          test -s "output/top5_rodada_${RODADA}.png"

      - name: Enriquecer contexto técnico real
        env:
          RODADA: ${{ steps.rodada.outputs.rodada }}
        run: |
          set -e
          python app/enriquecer_base_video_cartola_v1.py \
            --rodada "$RODADA" \
            --repo-root .

      - name: Gerar vídeo de pré-fechamento
        env:
          RODADA: ${{ steps.rodada.outputs.rodada }}
        run: |
          set -e
          VIDEO="output/analise_pre_fechamento_rodada_${RODADA}.mp4"
          MANIFESTO="output/analise_pre_fechamento_rodada_${RODADA}.json"
          rm -f "$VIDEO" "$MANIFESTO"
          VIDEO_FASE=PRE_FECHAMENTO python app/gerar_video_dialogo_cartola_v6.py \
            --rodada "$RODADA" \
            --repo-root . \
            --output "$VIDEO"
          test -s "$VIDEO"
          test -s "$MANIFESTO"

      - name: Validar fase e conteúdo antes do envio
        env:
          RODADA: ${{ steps.rodada.outputs.rodada }}
        run: |
          set -e
          python - "$RODADA" <<'PY'
          import json
          import re
          import sys
          import unicodedata
          from pathlib import Path

          rodada = int(sys.argv[1])
          path = Path(f'output/analise_pre_fechamento_rodada_{rodada}.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if str(data.get('fase_video') or '').upper() != 'PRE_FECHAMENTO':
              raise SystemExit(f"Fase incorreta no manifesto: {data.get('fase_video')}")
          timeline = data.get('timeline') or []
          if not timeline:
              raise SystemExit('Manifesto sem falas.')
          texto = ' '.join(
              str(item.get('texto_falado') or '') + ' ' + str(item.get('texto_tela') or '')
              for item in timeline
          ).lower()
          sem_acento = ''.join(
              c for c in unicodedata.normalize('NFD', texto)
              if unicodedata.category(c) != 'Mn'
          )
          if 'pre-fechamento' not in texto and 'pre-fechamento' not in sem_acento:
              raise SystemExit('O roteiro não identifica o pré-fechamento.')
          if re.search(r'(?<!\d)0[ºo]\s+colocado\b', texto, flags=re.I):
              raise SystemExit('Posição zero detectada.')
          for proibido in ('sem dados', 'sem dado', 'recorte histórico preservado', 'fora do snapshot'):
              if proibido in texto or proibido in sem_acento:
                  raise SystemExit(f'Conteúdo inválido detectado: {proibido}')
          print(f'Pré-fechamento R{rodada} validado com {len(timeline)} falas.')
          PY

      - name: Enviar vídeo ao Telegram
        env:
          RODADA: ${{ steps.rodada.outputs.rodada }}
          PLANILHA_ID: '1Lcb6kLFGdMSRNsG_yCCGjToHx2nLk0UaPdvA9Gf8Dx8'
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          ABA_TELEGRAM: 'Telegram_Cartola'
          CONTA_TELEGRAM: 'DICAS CARTOLA PORTAL SIMONSPORTS'
          TELEGRAM_CHAT_FALLBACK: '@dicascartolaportalsimonsports'
        run: |
          set -e
          python app/enviar_video_telegram.py \
            --video "output/analise_pre_fechamento_rodada_${RODADA}.mp4" \
            --rodada "$RODADA" \
            --fase PRE_FECHAMENTO

      - name: Restaurar snapshots atuais e salvar somente o vídeo
        env:
          RODADA: ${{ steps.rodada.outputs.rodada }}
        run: |
          set -e
          git restore \
            "data/publicacoes_atuais/time_economico_rodada_${RODADA}.json" \
            "data/publicacoes_atuais/time_intermediario_rodada_${RODADA}.json" \
            "data/publicacoes_atuais/time_pontuacao_rodada_${RODADA}.json" \
            "data/publicacoes_atuais/top5_rodada_${RODADA}.json" \
            "output/time_economico_rodada_${RODADA}.png" \
            "output/time_intermediario_rodada_${RODADA}.png" \
            "output/time_pontuacao_rodada_${RODADA}.png" \
            "output/top5_rodada_${RODADA}.png" || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            "data/analise_tecnica_rodada_${RODADA}_v3.json" \
            "output/analise_pre_fechamento_rodada_${RODADA}.mp4" \
            "output/analise_pre_fechamento_rodada_${RODADA}.json"

          if git diff --cached --quiet; then
            echo 'Vídeo enviado; nenhum arquivo permanente novo para commit.'
            exit 0
          fi

          git commit -m "Vídeo PRE_FECHAMENTO da rodada ${RODADA}"
          git pull --rebase origin main
          git push origin HEAD:main
