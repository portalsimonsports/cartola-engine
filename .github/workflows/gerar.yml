name: Gerar Times e Top5

on:
  repository_dispatch:
    types:
      - cartola_publish_test
  workflow_dispatch:
    inputs:
      payload_json:
        description: "Payload JSON manual; deixe vazio para reutilizar data/payload_dispatch.json"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: gerar-times-top5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gerar-times-top5:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade -r requirements.txt

      - name: Validar código profissional
        shell: bash
        run: |
          set -e
          python -m py_compile app/render_telegram_cards.py
          python -m py_compile app/gerar_resultados_telegram.py
          echo "Renderizador e publicador validados."

      - name: Preparar payload
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ github.event.inputs.payload_json }}
        run: |
          set -e
          mkdir -p data output

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            printf '%s' "$DISPATCH_PAYLOAD" > data/payload_dispatch.json
            echo "Payload recebido via repository_dispatch."
          elif [ -n "$MANUAL_PAYLOAD" ]; then
            printf '%s' "$MANUAL_PAYLOAD" > data/payload_dispatch.json
            echo "Payload manual informado no Run workflow."
          elif [ -s data/payload_dispatch.json ]; then
            echo "Reutilizando data/payload_dispatch.json existente."
          else
            echo "ERRO: não existe payload manual nem payload salvo."
            exit 1
          fi

          python -m json.tool data/payload_dispatch.json >/dev/null
          echo "Payload preparado e validado."

      - name: Gerar arte e publicar no Telegram
        shell: bash
        env:
          PAYLOAD_FILE: data/payload_dispatch.json
          OUTPUT_DIR: output
          TZ: America/Sao_Paulo
          PLANILHA_ID: ${{ secrets.PLANILHA_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          ABA_TELEGRAM: ${{ secrets.ABA_TELEGRAM }}
          CONTA_TELEGRAM: ${{ secrets.CONTA_TELEGRAM }}
          TELEGRAM_CHAT_FALLBACK: "@dicascartolaportalsimonsports"
        run: |
          set -e
          python app/gerar_resultados_telegram.py

      - name: Validar arquivos profissionais gerados
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("output/ultima_publicacao.json")
          if not manifest.exists():
              raise SystemExit("ERRO: manifesto da publicação não foi gerado.")

          data = json.loads(manifest.read_text(encoding="utf-8"))
          files = data.get("arquivos") or []
          if not files:
              raise SystemExit("ERRO: manifesto sem imagens.")

          missing = [path for path in files if not Path(path).exists()]
          if missing:
              raise SystemExit(f"ERRO: imagens ausentes: {missing}")

          print(f"Validação concluída: {len(files)} imagem(ns) profissional(is).")
          PY
          ls -lh output || true

      - name: Publicar arquivos gerados no repositório
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ output/ || true

          if git diff --cached --quiet; then
            echo "Sem alterações para commit."
            exit 0
          fi

          git commit -m "Telegram: artes profissionais da rodada"
          git pull --rebase origin main || true
          git push origin HEAD:main
