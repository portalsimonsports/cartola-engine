name: Gerar Times e Top5

on:
  repository_dispatch:
    types:
      - cartola_publish_test
      - cartola_publish_times
      - cartola_publish_top5
  workflow_dispatch:
    inputs:
      payload_json:
        description: "Payload JSON manual; deixe vazio para reutilizar data/payload_dispatch.json"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

# Um único publicador por vez. Isso elimina a corrida entre dispatches de
# Times e Top5 e permite que a trava persistente seja verificada antes do envio.
concurrency:
  group: cartola-times-top5-publicador-unico
  cancel-in-progress: false

jobs:
  gerar-times-top5:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade -r requirements.txt

      - name: Validar código profissional aprovado
        shell: bash
        run: |
          set -e
          python -m py_compile app/render_telegram_cards.py
          python -m py_compile app/gerar_resultados_telegram.py
          python -m py_compile app/publicar_times_top5_automatico.py
          python -m py_compile app/publicar_times_top5_automatico_v2.py
          echo "Renderizador e publicador de Times/Top 5 aprovados validados."

      - name: Preparar payload
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ github.event.inputs.payload_json }}
        run: |
          set -e
          mkdir -p data output data/flags

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            printf '%s' "$DISPATCH_PAYLOAD" > data/payload_dispatch.json
            echo "Payload recebido automaticamente via repository_dispatch."
          elif [ -n "$MANUAL_PAYLOAD" ]; then
            printf '%s' "$MANUAL_PAYLOAD" > data/payload_dispatch.json
            echo "Payload manual informado no Run workflow."
          elif [ -s data/payload_dispatch.json ]; then
            echo "Reutilizando data/payload_dispatch.json existente."
          else
            echo "ERRO: não existe payload manual nem payload salvo."
            exit 1
          fi

          python -m json.tool data/payload_dispatch.json >/dev/null
          rm -f output/top5_*.png output/time_*.png output/resultados_*.png
          rm -f output/boletim_*.png output/ultima_publicacao.json
          echo "Payload preparado e saídas anteriores limpas."

      - name: Validar evento e impedir publicação duplicada
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "marker=" >> "$GITHUB_OUTPUT"
            echo "Execução manual autorizada."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          payload = json.loads(Path("data/payload_dispatch.json").read_text(encoding="utf-8"))
          nested = payload.get("payload") if isinstance(payload.get("payload"), dict) else {}

          evento = str(
              payload.get("evento_programado")
              or nested.get("evento_programado")
              or ""
          ).strip().upper()

          rodada_raw = payload.get("rodada") or nested.get("rodada") or 0
          try:
              rodada = int(rodada_raw)
          except Exception:
              rodada = 0

          tipo = str(payload.get("tipo_publicacao") or nested.get("tipo_publicacao") or "").strip().upper()
          modelo = str(nested.get("modelo") or nested.get("tipo") or "").strip().upper()

          if "TOP5" in tipo or tipo == "TOP5":
              componente = "TOP5"
          elif modelo:
              componente = "TIME_" + modelo
          elif "ECON" in tipo:
              componente = "TIME_ECONOMICO"
          elif "INTER" in tipo:
              componente = "TIME_INTERMEDIARIO"
          elif "PONT" in tipo:
              componente = "TIME_PONTUACAO"
          else:
              componente = "TIMES"
          componente = re.sub(r"[^A-Z0-9_]+", "_", componente).strip("_") or "COMPONENTE"

          allowed_events = {
              "SELECAO_INICIAL",
              "ATUALIZACAO_20H",
              "PRE_FECHAMENTO_TIMES",
              "PRE_FECHAMENTO_TOP5",
              "CONFIRMADOS",
          }

          output = Path(os.environ["GITHUB_OUTPUT"])

          def finish(ok, marker="", reason=""):
              with output.open("a", encoding="utf-8") as fh:
                  fh.write(f"allowed={'true' if ok else 'false'}\n")
                  fh.write(f"evento={evento}\n")
                  fh.write(f"rodada={rodada}\n")
                  fh.write(f"componente={componente}\n")
                  fh.write(f"marker={marker}\n")
              print(reason)

          if evento not in allowed_events or rodada <= 0:
              finish(False, reason=f"BLOQUEADO: evento/rodada inválidos. evento={evento!r} rodada={rodada}")
              raise SystemExit(0)

          # REGRA DEFINITIVA: a atualização das 20h tem UM ÚNICO publicador.
          # Somente o Top 5 é publicado nessa janela; dispatches de Times são ignorados.
          if evento == "ATUALIZACAO_20H" and componente != "TOP5":
              finish(False, reason=f"BLOQUEADO: 20h publica somente TOP5; componente recebido={componente}")
              raise SystemExit(0)

          # Seleção inicial nunca pode ser repetida por perda/reset de flags do Apps Script.
          legacy = Path(f"data/flags/publicacao_SELECAO_INICIAL_rodada_{rodada}.json")
          if evento == "SELECAO_INICIAL" and legacy.exists():
              finish(False, legacy.as_posix(), f"BLOQUEADO: seleção inicial R{rodada} já registrada em {legacy}")
              raise SystemExit(0)

          hoje_sp = datetime.now(ZoneInfo("America/Sao_Paulo")).strftime("%Y-%m-%d")
          if evento == "ATUALIZACAO_20H":
              marker = Path(f"data/flags/publicacao_ATUALIZACAO_20H_rodada_{rodada}_{hoje_sp}_TOP5.json")
          else:
              marker = Path(f"data/flags/publicacao_{evento}_rodada_{rodada}_{componente}.json")

          if marker.exists():
              finish(False, marker.as_posix(), f"BLOQUEADO: publicação já realizada: {marker}")
              raise SystemExit(0)

          finish(True, marker.as_posix(), f"AUTORIZADO: evento={evento} rodada={rodada} componente={componente}")
          PY

      - name: Gerar e publicar Times e Top 5 aprovados
        if: steps.gate.outputs.allowed == 'true'
        shell: bash
        env:
          PAYLOAD_FILE: data/payload_dispatch.json
          OUTPUT_DIR: output
          TZ: America/Sao_Paulo
          PLANILHA_ID: ${{ secrets.PLANILHA_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          ABA_TELEGRAM: ${{ secrets.ABA_TELEGRAM }}
          CONTA_TELEGRAM: ${{ secrets.CONTA_TELEGRAM }}
          TELEGRAM_CHAT_FALLBACK: "@dicascartolaportalsimonsports"
          EVENTO_PROGRAMADO: ${{ steps.gate.outputs.evento }}
        run: |
          set -e
          python app/publicar_times_top5_automatico_v2.py

      - name: Validar arquivos profissionais gerados
        if: steps.gate.outputs.allowed == 'true'
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("output/ultima_publicacao.json")
          if not manifest.exists():
              raise SystemExit("ERRO: manifesto da publicação não foi gerado.")

          data = json.loads(manifest.read_text(encoding="utf-8"))
          publications = data.get("publicacoes") or []
          if not publications:
              raise SystemExit("ERRO: manifesto sem publicações.")

          files = [
              path
              for publication in publications
              for path in publication.get("arquivos", [])
          ]
          if not files:
              raise SystemExit("ERRO: nenhuma imagem foi gerada.")

          missing = [path for path in files if not Path(path).exists()]
          if missing:
              raise SystemExit(f"ERRO: imagens ausentes: {missing}")

          if any("boletim_" in Path(path).name for path in files):
              raise SystemExit("ERRO: publicação genérica/textual detectada.")

          print(
              f"Validação concluída: {len(publications)} publicação(ões), "
              f"{len(files)} imagem(ns)."
          )
          PY
          ls -lh output || true

      - name: Registrar publicação e persistir arquivos
        if: steps.gate.outputs.allowed == 'true' && success()
        shell: bash
        env:
          EVENTO: ${{ steps.gate.outputs.evento }}
          RODADA: ${{ steps.gate.outputs.rodada }}
          COMPONENTE: ${{ steps.gate.outputs.componente }}
          MARKER: ${{ steps.gate.outputs.marker }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$MARKER" ]; then
            mkdir -p "$(dirname "$MARKER")"
            printf '{\n  "status": "PUBLICADO_COM_SUCESSO",\n  "evento_programado": "%s",\n  "rodada": %s,\n  "componente": "%s",\n  "github_run_id": "%s",\n  "registrado_em": "%s"\n}\n' \
              "$EVENTO" "$RODADA" "$COMPONENTE" "${{ github.run_id }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$MARKER"
          fi

          git add \
            data/publicacoes_atuais/ \
            data/flags/ \
            output/*.png 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Sem alterações permanentes para commit."
            exit 0
          fi

          git commit -m "Telegram: ${EVENTO} R${RODADA} ${COMPONENTE}"

          echo "Estado antes da limpeza temporária:"
          git status --short || true
          git reset --hard HEAD
          git clean -fd
          echo "Árvore de trabalho limpa para sincronização com origin/main."

          enviado=0
          for tentativa in 1 2 3 4 5; do
            echo "Tentativa de push $tentativa/5"
            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD
            git clean -fd
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                enviado=1
                break
              fi
            fi

            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD
            sleep $((tentativa * 3))
          done

          if [ "$enviado" -ne 1 ]; then
            echo "ERRO: não foi possível publicar o commit após 5 tentativas."
            exit 1
          fi

          echo "Publicação registrada e commit enviado ao branch main."
