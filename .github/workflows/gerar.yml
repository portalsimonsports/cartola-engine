name: Gerar Times e Top5

on:
  repository_dispatch:
    types:
      - cartola_publish_test
      - cartola_publish_times
      - cartola_publish_top5
  workflow_dispatch:
    inputs:
      evento_programado:
        description: "Evento a publicar"
        required: true
        default: "ATUALIZACAO_20H"
        type: choice
        options:
          - ATUALIZACAO_20H
          - SELECAO_INICIAL
          - PRE_FECHAMENTO_TIMES
          - PRE_FECHAMENTO_TOP5
          - CONFIRMADOS
      rodada:
        description: "Rodada atual do Cartola"
        required: true
        type: string
      payload_json:
        description: "Payload JSON manual opcional; se informado, tem prioridade"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: cartola-times-top5-publicador-unico
  cancel-in-progress: false

jobs:
  gerar-times-top5:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade -r requirements.txt

      - name: Validar código profissional aprovado
        shell: bash
        run: |
          set -e
          python -m py_compile app/render_telegram_cards.py
          python -m py_compile app/gerar_resultados_telegram.py
          python -m py_compile app/publicar_times_top5_automatico.py
          python -m py_compile app/publicar_times_top5_automatico_v2.py
          echo "Renderizador e publicador de Times/Top 5 validados."

      - name: Preparar payload
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ github.event.inputs.payload_json }}
          MANUAL_EVENTO: ${{ github.event.inputs.evento_programado }}
          MANUAL_RODADA: ${{ github.event.inputs.rodada }}
        run: |
          set -e
          mkdir -p data output data/flags

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            printf '%s' "$DISPATCH_PAYLOAD" > data/payload_dispatch.json
            echo "Payload recebido via repository_dispatch."
          elif [ -n "$MANUAL_PAYLOAD" ]; then
            printf '%s' "$MANUAL_PAYLOAD" > data/payload_dispatch.json
            echo "Payload JSON manual informado."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          evento = str(os.environ.get("MANUAL_EVENTO") or "").strip().upper()
          rodada_raw = str(os.environ.get("MANUAL_RODADA") or "").strip()

          try:
              rodada = int(rodada_raw)
          except Exception:
              raise SystemExit("ERRO: informe uma rodada numérica válida na execução manual.")

          if rodada <= 0:
              raise SystemExit("ERRO: a rodada manual deve ser maior que zero.")

          payload = {
              "evento_programado": evento,
              "rodada": rodada,
              "tipo_publicacao": "top5" if evento == "PRE_FECHAMENTO_TOP5" else "times",
              "modelo": "" if evento == "PRE_FECHAMENTO_TOP5" else "ECONOMICO",
              "origem": "workflow_dispatch_manual",
          }

          Path("data/payload_dispatch.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"Payload manual construído: evento={evento} rodada={rodada}")
          PY
          else
            echo "ERRO: origem de execução não reconhecida."
            exit 1
          fi

          python -m json.tool data/payload_dispatch.json >/dev/null
          rm -f output/top5_*.png output/time_*.png output/resultados_*.png
          rm -f output/boletim_*.png output/ultima_publicacao.json

      - name: Validar evento e escolher o único publicador
        id: gate
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          payload = json.loads(Path("data/payload_dispatch.json").read_text(encoding="utf-8"))
          nested = payload.get("payload") if isinstance(payload.get("payload"), dict) else {}

          evento = str(payload.get("evento_programado") or nested.get("evento_programado") or "").strip().upper()
          rodada_raw = payload.get("rodada") or nested.get("rodada") or 0
          try:
              rodada = int(float(rodada_raw))
          except Exception:
              rodada = 0

          tipo = str(payload.get("tipo_publicacao") or nested.get("tipo_publicacao") or "").strip().upper()
          modelo = str(payload.get("modelo") or nested.get("modelo") or nested.get("tipo") or "").strip().upper()

          if "TOP5" in tipo:
              componente = "TOP5"
          elif modelo:
              componente = "TIME_" + modelo
          elif "ECON" in tipo:
              componente = "TIME_ECONOMICO"
          elif "INTER" in tipo:
              componente = "TIME_INTERMEDIARIO"
          elif "PONT" in tipo:
              componente = "TIME_PONTUACAO"
          else:
              componente = "TIMES"
          componente = re.sub(r"[^A-Z0-9_]+", "_", componente).strip("_") or "COMPONENTE"

          allowed_events = {
              "SELECAO_INICIAL",
              "ATUALIZACAO_20H",
              "PRE_FECHAMENTO_TIMES",
              "PRE_FECHAMENTO_TOP5",
              "CONFIRMADOS",
          }

          output = Path(os.environ["GITHUB_OUTPUT"])

          def finish(ok, marker="", publisher_name="", reason=""):
              with output.open("a", encoding="utf-8") as fh:
                  fh.write(f"allowed={'true' if ok else 'false'}\n")
                  fh.write(f"evento={evento}\n")
                  fh.write(f"rodada={rodada}\n")
                  fh.write(f"componente={componente}\n")
                  fh.write(f"publisher={publisher_name}\n")
                  fh.write(f"marker={marker}\n")
              print(reason)

          if evento not in allowed_events or rodada <= 0:
              finish(False, reason=f"BLOQUEADO: evento/rodada inválidos. evento={evento!r} rodada={rodada}")
              raise SystemExit(0)

          hoje_sp = datetime.now(ZoneInfo("America/Sao_Paulo")).strftime("%Y-%m-%d")

          if evento in {"SELECAO_INICIAL", "ATUALIZACAO_20H", "CONFIRMADOS"}:
              if evento == "ATUALIZACAO_20H":
                  marker = Path(f"data/flags/publicacao_ATUALIZACAO_20H_rodada_{rodada}_{hoje_sp}_PACOTE.json")
              else:
                  marker = Path(f"data/flags/publicacao_{evento}_rodada_{rodada}_PACOTE.json")
              publisher_name = "PACOTE_3_TIMES_TOP5"

          elif evento == "PRE_FECHAMENTO_TIMES":
              if componente == "TOP5":
                  finish(False, reason="BLOQUEADO: PRE_FECHAMENTO_TIMES não aceita dispatch TOP5")
                  raise SystemExit(0)
              marker = Path(f"data/flags/publicacao_PRE_FECHAMENTO_TIMES_rodada_{rodada}_PACOTE.json")
              publisher_name = "PACOTE_3_TIMES"

          else:
              if componente != "TOP5":
                  finish(False, reason=f"BLOQUEADO: PRE_FECHAMENTO_TOP5 aceita somente TOP5; recebido={componente}")
                  raise SystemExit(0)
              marker = Path(f"data/flags/publicacao_PRE_FECHAMENTO_TOP5_rodada_{rodada}_TOP5.json")
              publisher_name = "TOP5"

          legacy = Path(f"data/flags/publicacao_SELECAO_INICIAL_rodada_{rodada}.json")
          if evento == "SELECAO_INICIAL" and legacy.exists():
              finish(False, legacy.as_posix(), publisher_name, f"BLOQUEADO: seleção inicial R{rodada} já registrada")
              raise SystemExit(0)

          if marker.exists():
              finish(False, marker.as_posix(), publisher_name, f"BLOQUEADO: pacote já publicado: {marker}")
              raise SystemExit(0)

          finish(True, marker.as_posix(), publisher_name, f"AUTORIZADO: evento={evento} rodada={rodada} disparador={componente} publicador={publisher_name}")
          PY

      - name: Gerar e publicar pacote aprovado
        if: steps.gate.outputs.allowed == 'true'
        shell: bash
        env:
          PAYLOAD_FILE: data/payload_dispatch.json
          OUTPUT_DIR: output
          TZ: America/Sao_Paulo
          PLANILHA_ID: ${{ secrets.PLANILHA_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          ABA_TELEGRAM: ${{ secrets.ABA_TELEGRAM }}
          CONTA_TELEGRAM: ${{ secrets.CONTA_TELEGRAM }}
          TELEGRAM_CHAT_FALLBACK: "@dicascartolaportalsimonsports"
          EVENTO_PROGRAMADO: ${{ steps.gate.outputs.evento }}
        run: |
          set -e
          python app/publicar_times_top5_automatico_v2.py

      - name: Validar pacote completo e sem duplicidade
        if: steps.gate.outputs.allowed == 'true'
        shell: bash
        env:
          EVENTO: ${{ steps.gate.outputs.evento }}
        run: |
          set -e
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          event = os.environ.get("EVENTO", "").strip().upper()
          manifest = Path("output/ultima_publicacao.json")
          if not manifest.exists():
              raise SystemExit("ERRO: manifesto da publicação não foi gerado.")

          data = json.loads(manifest.read_text(encoding="utf-8"))
          publications = data.get("publicacoes") or []

          expected_types = {
              "SELECAO_INICIAL": {"time_economico", "time_intermediario", "time_pontuacao", "top5"},
              "ATUALIZACAO_20H": {"time_economico", "time_intermediario", "time_pontuacao", "top5"},
              "CONFIRMADOS": {"time_economico", "time_intermediario", "time_pontuacao", "top5"},
              "PRE_FECHAMENTO_TIMES": {"time_economico", "time_intermediario", "time_pontuacao"},
              "PRE_FECHAMENTO_TOP5": {"top5"},
          }[event]

          actual = [str(item.get("tipo_publicacao") or "").strip().lower() for item in publications]
          counts = Counter(actual)
          duplicates = {key: value for key, value in counts.items() if value > 1}

          if duplicates:
              raise SystemExit(f"ERRO: publicação duplicada detectada: {duplicates}")
          if set(actual) != expected_types or len(actual) != len(expected_types):
              raise SystemExit(f"ERRO: pacote incompleto/incorreto. esperado={sorted(expected_types)} recebido={actual}")

          files = [path for publication in publications for path in publication.get("arquivos", [])]
          if not files:
              raise SystemExit("ERRO: nenhuma imagem foi gerada.")

          missing = [path for path in files if not Path(path).exists()]
          if missing:
              raise SystemExit(f"ERRO: imagens ausentes: {missing}")

          if any("boletim_" in Path(path).name for path in files):
              raise SystemExit("ERRO: publicação genérica/textual detectada.")

          print(f"PACOTE OK: evento={event}; publicações={actual}; imagens={len(files)}")
          PY

      - name: Registrar pacote somente após envio completo
        if: steps.gate.outputs.allowed == 'true' && success()
        shell: bash
        env:
          EVENTO: ${{ steps.gate.outputs.evento }}
          RODADA: ${{ steps.gate.outputs.rodada }}
          COMPONENTE: ${{ steps.gate.outputs.componente }}
          PUBLICADOR: ${{ steps.gate.outputs.publisher }}
          MARKER: ${{ steps.gate.outputs.marker }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$MARKER" ]; then
            echo "Sem marker para registrar."
            exit 0
          fi

          tmp_dir="$(mktemp -d)"
          marker_tmp="$tmp_dir/marker.json"
          mkdir -p "$tmp_dir/publicacoes_atuais"

          printf '{\n  "status": "PUBLICADO_COM_SUCESSO",\n  "evento_programado": "%s",\n  "rodada": %s,\n  "publicador": "%s",\n  "componente_disparador": "%s",\n  "github_run_id": "%s",\n  "registrado_em": "%s"\n}\n' \
            "$EVENTO" "$RODADA" "$PUBLICADOR" "$COMPONENTE" "${{ github.run_id }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$marker_tmp"

          # Preservar os snapshots gerados ANTES do reset do repositório.
          # Esses arquivos alimentam os workflows de análise em vídeo.
          case "$EVENTO" in
            PRE_FECHAMENTO_TIMES)
              for f in \
                "data/publicacoes_atuais/time_economico_rodada_${RODADA}.json" \
                "data/publicacoes_atuais/time_intermediario_rodada_${RODADA}.json" \
                "data/publicacoes_atuais/time_pontuacao_rodada_${RODADA}.json"; do
                [ -f "$f" ] && cp "$f" "$tmp_dir/publicacoes_atuais/"
              done
              ;;
            PRE_FECHAMENTO_TOP5)
              f="data/publicacoes_atuais/top5_rodada_${RODADA}.json"
              [ -f "$f" ] && cp "$f" "$tmp_dir/publicacoes_atuais/"
              ;;
            *)
              for f in \
                "data/publicacoes_atuais/time_economico_rodada_${RODADA}.json" \
                "data/publicacoes_atuais/time_intermediario_rodada_${RODADA}.json" \
                "data/publicacoes_atuais/time_pontuacao_rodada_${RODADA}.json" \
                "data/publicacoes_atuais/top5_rodada_${RODADA}.json"; do
                [ -f "$f" ] && cp "$f" "$tmp_dir/publicacoes_atuais/"
              done
              ;;
          esac

          enviado=0
          for tentativa in 1 2 3 4 5; do
            echo "Tentativa de registrar marker/snapshots $tentativa/5"

            git fetch origin main
            git reset --hard origin/main

            if [ -f "$MARKER" ]; then
              echo "Marker já existe no branch main: $MARKER"
              enviado=1
              break
            fi

            mkdir -p "$(dirname "$MARKER")" data/publicacoes_atuais
            cp "$marker_tmp" "$MARKER"
            cp "$tmp_dir"/publicacoes_atuais/*.json data/publicacoes_atuais/ 2>/dev/null || true

            git add "$MARKER" data/publicacoes_atuais/*.json 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "Nada novo para registrar."
              enviado=1
              break
            fi

            git commit -m "Telegram: registrar ${EVENTO} R${RODADA} pacote único"

            if git push origin HEAD:main; then
              enviado=1
              break
            fi

            sleep $((tentativa * 2))
          done

          rm -rf "$tmp_dir"

          if [ "$enviado" -ne 1 ]; then
            echo "ERRO: não foi possível registrar o marker/snapshots após 5 tentativas."
            exit 1
          fi

          echo "Pacote enviado ao Telegram e snapshots persistidos para análises em vídeo."
