name: Gerar Times e Top5

on:
  repository_dispatch:
    types:
      - cartola_publish_test
  workflow_dispatch:
    inputs:
      payload_json:
        description: "Payload JSON manual para teste"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: gerar-times-top5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gerar-times-top5:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip setuptools wheel
          pip install --upgrade -r requirements.txt

      - name: Preparar payload
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          MANUAL_PAYLOAD: ${{ github.event.inputs.payload_json }}
        run: |
          set -e
          mkdir -p data output

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            printf '%s' "$DISPATCH_PAYLOAD" > data/payload_dispatch.json
          else
            if [ -z "$MANUAL_PAYLOAD" ]; then
              echo "ERRO: execução manual sem payload_json."
              exit 1
            fi
            printf '%s' "$MANUAL_PAYLOAD" > data/payload_dispatch.json
          fi

          python -m json.tool data/payload_dispatch.json >/dev/null
          echo "Payload preparado e validado."

      - name: Publicar no Telegram
        shell: bash
        env:
          PAYLOAD_FILE: data/payload_dispatch.json
          TZ: America/Sao_Paulo
          PLANILHA_ID: ${{ secrets.PLANILHA_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          ABA_TELEGRAM: ${{ vars.ABA_TELEGRAM }}
          CONTA_TELEGRAM: ${{ vars.CONTA_TELEGRAM }}
        run: |
          set -e
          python app/gerar_resultados_telegram.py

      - name: Publicar arquivos gerados no repositório
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ output/ || true

          if git diff --cached --quiet; then
            echo "Sem alterações para commit."
            exit 0
          fi

          git commit -m "Times e Top5: geração automática"
          git pull --rebase origin main || true
          git push origin HEAD:main
