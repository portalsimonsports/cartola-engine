name: Garantir Abertura da Live após Fechamento

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: live-abertura-pos-fechamento
  cancel-in-progress: false

jobs:
  garantir-live-abertura:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verificar fechamento e preparar abertura da Live
        id: gate
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          def get_json(url):
              req = urllib.request.Request(url, headers={"User-Agent":"PortalSimonSports/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          status = get_json("https://api.cartola.globo.com/mercado/status")
          rodada = int(status.get("rodada_atual") or status.get("rodada") or 0)
          fechamento = status.get("fechamento") or {}
          if isinstance(fechamento, dict):
              ano = int(fechamento.get("ano") or 0)
              mes = int(fechamento.get("mes") or 0)
              dia = int(fechamento.get("dia") or 0)
              hora = int(fechamento.get("hora") or 0)
              minuto = int(fechamento.get("minuto") or 0)
              if not all([ano, mes, dia]):
                  raise SystemExit("Sem data de fechamento válida")
              dt_fechamento = datetime(ano, mes, dia, hora, minuto, tzinfo=ZoneInfo("America/Sao_Paulo"))
          else:
              raise SystemExit("Formato de fechamento inesperado")

          agora = datetime.now(ZoneInfo("America/Sao_Paulo"))
          diff_min = (agora - dt_fechamento).total_seconds() / 60.0
          mercado_status = int(status.get("status_mercado") or status.get("status") or 0)

          # Abertura da Live: imediatamente após o fechamento. Janela de segurança
          # de 0 a 20 minutos para absorver atraso do scheduler do GitHub.
          permitido = rodada > 0 and mercado_status != 1 and 0 <= diff_min <= 20

          # Não repetir se a abertura da rodada já foi publicada.
          ja_publicado = any(Path("output").glob(f"live_abertura_rodada_{rodada}_p*.png"))
          if ja_publicado:
              permitido = False

          payload_path = Path("data/live_abertura_fallback_payload.json")
          if permitido:
              try:
                  partidas_api = get_json(f"https://api.cartola.globo.com/partidas/{rodada}")
              except Exception:
                  partidas_api = {}
              partidas = partidas_api.get("partidas") if isinstance(partidas_api, dict) else []
              if not isinstance(partidas, list):
                  partidas = []

              payload = {
                  "origem": "live_abertura_fallback_github",
                  "evento_github": "cartola_live_publish",
                  "workflow_destino": "gerar.resultados.yml",
                  "tipo_publicacao": "live_abertura",
                  "evento_programado": "LIVE_ABERTURA",
                  "contexto": "abertura_live",
                  "rodada": rodada,
                  "payload": {
                      "origem": "live_abertura_fallback_github",
                      "tipo_publicacao": "live_abertura",
                      "evento_programado": "LIVE_ABERTURA",
                      "contexto": "abertura_live",
                      "titulo": f"ABERTURA DA LIVE • RODADA {rodada}",
                      "rodada": rodada,
                      "partidas": partidas,
                      "mensagem_oficial": "Abertura da cobertura ao vivo da rodada com classificação do Brasileirão e jogos do dia."
                  }
              }
              payload_path.write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"allowed={'true' if permitido else 'false'}\n")
              fh.write(f"rodada={rodada}\n")
              fh.write(f"diff_min={diff_min:.2f}\n")

          print(f"rodada={rodada} mercado_status={mercado_status} diff_min={diff_min:.2f} ja_publicado={ja_publicado} permitido={permitido}")
          PY

      - name: Disparar abertura da Live e classificação
        if: steps.gate.outputs.allowed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          PAYLOAD=$(cat data/live_abertura_fallback_payload.json)
          python - <<'PY' > /tmp/body.json
          import json
          from pathlib import Path
          p=json.loads(Path('data/live_abertura_fallback_payload.json').read_text(encoding='utf-8'))
          print(json.dumps({"event_type":"cartola_live_publish","client_payload":p}, ensure_ascii=False))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/dispatches" \
            --data-binary @/tmp/body.json
          echo "Abertura da Live disparada para a rodada ${{ steps.gate.outputs.rodada }}."
