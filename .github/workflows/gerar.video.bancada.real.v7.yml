name: Gerar Vídeo Bancada Real V7

on:
  push:
    branches: [main]
    paths:
      - app/gerar_video_bancada_real_v7.py
      - .github/workflows/gerar.video.bancada.real.v7.yml
  workflow_dispatch:
    inputs:
      rodada:
        description: "Rodada do piloto"
        required: false
        default: "22"

permissions:
  contents: write

concurrency:
  group: gerar-video-bancada-real-v7
  cancel-in-progress: false

jobs:
  gerar-piloto:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install edge-tts Pillow requests

      - name: Resolver rodada
        id: dados
        env:
          RODADA_MANUAL: ${{ github.event.inputs.rodada }}
        run: |
          RODADA="${RODADA_MANUAL:-22}"
          echo "rodada=$RODADA" >> "$GITHUB_OUTPUT"
          echo "video=output/piloto_bancada_real_rodada_${RODADA}_v7.mp4" >> "$GITHUB_OUTPUT"
          echo "manifesto=output/piloto_bancada_real_rodada_${RODADA}_v7.json" >> "$GITHUB_OUTPUT"

      - name: Gerar e enriquecer base técnica
        env:
          RODADA: ${{ steps.dados.outputs.rodada }}
        run: |
          set -e
          python app/gerar_base_video_por_snapshot.py --rodada "$RODADA" --repo-root .
          python app/enriquecer_base_video_cartola_v1.py --rodada "$RODADA" --repo-root .
          test -s "data/analise_tecnica_rodada_${RODADA}_v3.json"

      - name: Validar gerador
        run: |
          python -m py_compile app/gerar_video_bancada_real_v7.py

      - name: Gerar vídeo de bancada real
        env:
          RODADA: ${{ steps.dados.outputs.rodada }}
          VIDEO: ${{ steps.dados.outputs.video }}
          MANIFESTO: ${{ steps.dados.outputs.manifesto }}
        run: |
          set -e
          rm -f "$VIDEO" "$MANIFESTO"
          python app/gerar_video_bancada_real_v7.py \
            --rodada "$RODADA" \
            --repo-root . \
            --output "$VIDEO"
          test -s "$VIDEO"
          test -s "$MANIFESTO"

      - name: Validar correções solicitadas
        env:
          VIDEO: ${{ steps.dados.outputs.video }}
          MANIFESTO: ${{ steps.dados.outputs.manifesto }}
        run: |
          set -e
          DURACAO="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          python - "$DURACAO" "$MANIFESTO" <<'PY'
          import json
          import sys
          from pathlib import Path

          duration = float(sys.argv[1])
          manifest = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          timeline = manifest.get("timeline") or []

          if not 480 <= duration <= 1000:
              raise SystemExit(f"Duração fora do alvo: {duration:.2f}s")
          required_true = [
              "abertura_profissional",
              "primeira_fala_direta",
              "filmagem_com_movimento_corporal_real",
              "layout_sem_sobreposicao",
              "painel_fora_da_area_dos_apresentadores",
              "cortes_entre_planos",
          ]
          for key in required_true:
              if manifest.get(key) is not True:
                  raise SystemExit(f"Validação ausente: {key}")
          if manifest.get("movimento_global_artificial_da_imagem") is not False:
              raise SystemExit("O vídeo ainda utiliza balanço artificial da imagem.")
          if manifest.get("legenda_longa_sobre_apresentadores") is not False:
              raise SystemExit("Existe legenda longa sobre os apresentadores.")

          voices = manifest.get("vozes_aprovadas") or {}
          expected = {
              "FRANCISCA": "pt-BR-FranciscaNeural",
              "ANTÔNIO": "pt-BR-AntonioNeural",
              "THALITA": "pt-BR-ThalitaMultilingualNeural",
          }
          if voices != expected:
              raise SystemExit(f"Vozes incorretas: {voices}")
          if not timeline:
              raise SystemExit("Linha do tempo vazia.")
          first = str(timeline[0].get("texto_falado", ""))
          if not first.startswith("Começa agora a análise da rodada"):
              raise SystemExit(f"Abertura incorreta: {first}")

          combined = " ".join(str(item.get("texto_falado", "")).lower() for item in timeline)
          forbidden = [
              "a dinâmica do programa",
              "vamos explicar como",
              "as imagens preservam exatamente",
              "o áudio utiliza",
              "não haverá zero",
              "cada atleta será apresentado",
          ]
          found = [term for term in forbidden if term in combined]
          if found:
              raise SystemExit("Explicação de bastidor encontrada: " + ", ".join(found))

          print(f"V7 validado: {duration:.2f}s, {len(timeline)} falas e vozes aprovadas.")
          PY

      - name: Publicar artefato para aprovação
        uses: actions/upload-artifact@v4
        with:
          name: piloto-bancada-real-v7-rodada-${{ steps.dados.outputs.rodada }}
          path: |
            ${{ steps.dados.outputs.video }}
            ${{ steps.dados.outputs.manifesto }}
          retention-days: 30

      - name: Salvar piloto no repositório
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "data/analise_tecnica_rodada_${{ steps.dados.outputs.rodada }}_v3.json" \
            "${{ steps.dados.outputs.video }}" \
            "${{ steps.dados.outputs.manifesto }}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Vídeo de bancada real V7 da rodada ${{ steps.dados.outputs.rodada }}"
          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((tentativa * 4))
          done
          exit 1
