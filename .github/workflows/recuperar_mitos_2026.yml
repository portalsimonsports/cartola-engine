name: Recuperar Mitos 2026

on:
  push:
    branches: [main]
    paths:
      - 'scripts/recuperar_mitos_2026.py'
      - '.github/workflows/recuperar_mitos_2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recuperar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Coletar escalações
        run: python scripts/recuperar_mitos_2026.py

      - name: Salvar resultado no repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mitos_2026_por_rodada/
          if git diff --cached --quiet; then
            echo 'Sem alterações.'
          else
            git commit -m 'Dados: escalações dos Mitos 2026 por rodada'
            git push
          fi
