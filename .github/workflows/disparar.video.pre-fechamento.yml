name: Disparar Vídeo de Pré-Fechamento

on:
  workflow_run:
    workflows:
      - Gerar Times e Top5
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: cartola-video-pre-fechamento-guard
  cancel-in-progress: false

jobs:
  verificar-e-disparar:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main com histórico
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Detectar pré-fechamento completo e pendente
        id: detectar
        run: |
          set -e
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          base=Path('data/publicacoes_atuais'); out=Path(os.environ['GITHUB_OUTPUT'])
          def load(path):
              try:
                  d=json.loads(path.read_text(encoding='utf-8')); return d if isinstance(d,dict) else {}
              except Exception:return {}
          def rows(d):
              v=d.get('jogadores') or d.get('atletas') or d.get('dados') or d.get('lista') or []; return [x for x in v if isinstance(x,dict)]
          def git_json(c,p):
              r=subprocess.run(['git','show',f'{c}:{p}'],text=True,capture_output=True)
              if r.returncode!=0 or not r.stdout.strip(): return {}
              try:return json.loads(r.stdout)
              except Exception:return {}
          rodas=[]
          for path in base.glob('top5_rodada_*.json'):
              m=re.search(r'rodada_(\d+)\.json$',path.name)
              if m: rodas.append(int(m.group(1)))
          if not rodas:
              out.write_text('ready=false\n',encoding='utf-8'); raise SystemExit(0)
          rodada=max(rodas)
          if Path(f'output/analise_pre_fechamento_rodada_{rodada}.mp4').exists() and Path(f'output/analise_pre_fechamento_rodada_{rodada}.json').exists() and Path(f'data/flags/video_pre_fechamento_rodada_{rodada}.publicado.json').exists():
              out.write_text('ready=false\n',encoding='utf-8'); print(f'Pré-fechamento R{rodada} já publicado de fato.'); raise SystemExit(0)
          required={
            f'data/publicacoes_atuais/time_economico_rodada_{rodada}.json':('PRE_FECHAMENTO_TIMES',12),
            f'data/publicacoes_atuais/time_intermediario_rodada_{rodada}.json':('PRE_FECHAMENTO_TIMES',12),
            f'data/publicacoes_atuais/time_pontuacao_rodada_{rodada}.json':('PRE_FECHAMENTO_TIMES',12),
            f'data/publicacoes_atuais/top5_rodada_{rodada}.json':('PRE_FECHAMENTO_TOP5',30),
          }
          problemas=[]
          for rel,(evento,minimo) in required.items():
              d=load(Path(rel)); ok=int(d.get('rodada') or 0)==rodada and str(d.get('evento_programado') or '').upper()==evento and len(rows(d))>=minimo
              if not ok:
                  commits=subprocess.run(['git','log','--format=%H','--all','--',rel],text=True,capture_output=True).stdout.splitlines()
                  ok=any(int((g:=git_json(c,rel)).get('rodada') or 0)==rodada and str(g.get('evento_programado') or '').upper()==evento and len(rows(g))>=minimo for c in commits)
              if not ok: problemas.append(rel)
          if problemas:
              out.write_text('ready=false\n',encoding='utf-8'); print('Pré-fechamento incompleto: '+' | '.join(problemas)); raise SystemExit(0)
          with out.open('a',encoding='utf-8') as fh:
              fh.write('ready=true\n'); fh.write(f'rodada={rodada}\n')
          print(f'Pré-fechamento R{rodada} completo e ainda não publicado; dispatch autorizado.')
          PY

      - name: Disparar vídeo de pré-fechamento
        if: steps.detectar.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RODADA: ${{ steps.detectar.outputs.rodada }}
        run: |
          set -e
          payload="{\"event_type\":\"cartola_video_analise\",\"client_payload\":{\"rodada\":${RODADA},\"fase\":\"PRE_FECHAMENTO\",\"origem\":\"guard_pre_fechamento_v2\"}}"
          codigo="$(curl -sS -o /tmp/resposta.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" -d "$payload")"
          cat /tmp/resposta.json || true
          test "$codigo" -ge 200 && test "$codigo" -lt 300
          echo "Dispatch PRE_FECHAMENTO R${RODADA} aceito: HTTP ${codigo}."
