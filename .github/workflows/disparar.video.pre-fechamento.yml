name: Disparar Vídeo de Pré-Fechamento

on:
  workflow_run:
    workflows:
      - Gerar Times e Top5
    types:
      - completed
  push:
    branches: [main]
    paths:
      - '.github/workflows/disparar.video.pre-fechamento.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cartola-video-pre-fechamento
  cancel-in-progress: true

jobs:
  detectar:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.detectar.outputs.ready }}
      rodada: ${{ steps.detectar.outputs.rodada }}
    steps:
      - name: Checkout main com histórico
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detectar pré-fechamento completo e ainda não publicado
        id: detectar
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          base=Path('data/publicacoes_atuais'); out=Path(os.environ['GITHUB_OUTPUT'])
          def load(path):
              try:
                  d=json.loads(path.read_text(encoding='utf-8')); return d if isinstance(d,dict) else {}
              except Exception:return {}
          def rows(d):
              v=d.get('jogadores') or d.get('atletas') or d.get('dados') or d.get('lista') or []; return [x for x in v if isinstance(x,dict)]
          def git_json(c,p):
              r=subprocess.run(['git','show',f'{c}:{p}'],text=True,capture_output=True)
              if r.returncode!=0 or not r.stdout.strip():return {}
              try:
                  d=json.loads(r.stdout); return d if isinstance(d,dict) else {}
              except Exception:return {}
          def has_snapshot(rel,rodada,evento,minimo):
              d=load(Path(rel))
              if int(d.get('rodada') or 0)==rodada and str(d.get('evento_programado') or '').upper()==evento and len(rows(d))>=minimo:return True
              commits=subprocess.run(['git','log','--format=%H','--all','--',rel],text=True,capture_output=True).stdout.splitlines()
              for c in commits:
                  d=git_json(c,rel)
                  if int(d.get('rodada') or 0)==rodada and str(d.get('evento_programado') or '').upper()==evento and len(rows(d))>=minimo:return True
              return False
          rodadas=[]
          for path in base.glob('top5_rodada_*.json'):
              m=re.search(r'rodada_(\d+)\.json$',path.name)
              if m:rodadas.append(int(m.group(1)))
          for rodada in sorted(set(rodadas),reverse=True):
              video=Path(f'output/analise_pre_fechamento_rodada_{rodada}.mp4'); manifesto=Path(f'output/analise_pre_fechamento_rodada_{rodada}.json'); flag=Path(f'data/flags/video_pre_fechamento_rodada_{rodada}.publicado.json')
              if video.exists() and manifesto.exists() and flag.exists():continue
              req=[
                  (f'data/publicacoes_atuais/time_economico_rodada_{rodada}.json','PRE_FECHAMENTO_TIMES',12),
                  (f'data/publicacoes_atuais/time_intermediario_rodada_{rodada}.json','PRE_FECHAMENTO_TIMES',12),
                  (f'data/publicacoes_atuais/time_pontuacao_rodada_{rodada}.json','PRE_FECHAMENTO_TIMES',12),
                  (f'data/publicacoes_atuais/top5_rodada_{rodada}.json','PRE_FECHAMENTO_TOP5',30),
              ]
              if all(has_snapshot(rel,rodada,evento,minimo) for rel,evento,minimo in req):
                  with out.open('a',encoding='utf-8') as fh:
                      fh.write('ready=true\n'); fh.write(f'rodada={rodada}\n')
                  print(f'Análise de pré-fechamento R{rodada} pronta e ainda não publicada.'); raise SystemExit(0)
          out.write_text('ready=false\n',encoding='utf-8'); print('Nenhuma análise de pré-fechamento pendente com snapshots completos.')
          PY

  publicar:
    needs: detectar
    if: needs.detectar.outputs.ready == 'true'
    uses: ./.github/workflows/publicar.video.cartola.yml
    with:
      rodada: ${{ needs.detectar.outputs.rodada }}
      fase: PRE_FECHAMENTO
    secrets: inherit
