name: Publicar Vídeo Cartola

on:
  repository_dispatch:
    types:
      - cartola_video_analise
  workflow_dispatch:
    inputs:
      rodada:
        description: "Rodada"
        required: true
        default: "22"
      fase:
        description: "INICIAL ou PRE_FECHAMENTO"
        required: true
        default: "INICIAL"

permissions:
  contents: write

concurrency:
  group: publicar-video-cartola-${{ github.event.client_payload.rodada || github.event.inputs.rodada }}-${{ github.event.client_payload.fase || github.event.inputs.fase }}
  cancel-in-progress: false

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install edge-tts Pillow requests google-api-python-client google-auth

      - name: Resolver evento
        id: evento
        env:
          DISPATCH_RODADA: ${{ github.event.client_payload.rodada }}
          DISPATCH_FASE: ${{ github.event.client_payload.fase }}
          MANUAL_RODADA: ${{ github.event.inputs.rodada }}
          MANUAL_FASE: ${{ github.event.inputs.fase }}
        run: |
          RODADA="${DISPATCH_RODADA:-${MANUAL_RODADA:-22}}"
          FASE="${DISPATCH_FASE:-${MANUAL_FASE:-INICIAL}}"
          FASE="$(printf '%s' "$FASE" | tr '[:lower:]' '[:upper:]')"
          case "$FASE" in INICIAL|PRE_FECHAMENTO) ;; *) echo "Fase inválida: $FASE"; exit 1;; esac
          VIDEO="output/analise_$(printf '%s' "$FASE" | tr '[:upper:]' '[:lower:]')_rodada_${RODADA}.mp4"
          MANIFESTO="${VIDEO%.mp4}.json"
          echo "rodada=$RODADA" >> "$GITHUB_OUTPUT"
          echo "fase=$FASE" >> "$GITHUB_OUTPUT"
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
          echo "manifesto=$MANIFESTO" >> "$GITHUB_OUTPUT"

      - name: Corrigir conflito do Google API build
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/gerar_base_analise_cartola.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from googleapiclient.discovery import build',
              'from googleapiclient.discovery import build as google_api_build',
              1,
          )
          text = text.replace(
              'return build("sheets", "v4", credentials=credentials, cache_discovery=False)',
              'return google_api_build("sheets", "v4", credentials=credentials, cache_discovery=False)',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          grep -n "google_api_build" app/gerar_base_analise_cartola.py

      - name: Gerar base técnica da rodada
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
          PLANILHA_ID: ${{ secrets.PLANILHA_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
        run: |
          set -e
          python app/gerar_base_analise_cartola.py --rodada "$RODADA" --repo-root .
          test -s "data/analise_tecnica_rodada_${RODADA}_v3.json"

      - name: Validar imagens da rodada
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
        run: |
          set -e
          test -s "output/time_economico_rodada_${RODADA}.png"
          test -s "output/time_intermediario_rodada_${RODADA}.png"
          test -s "output/time_pontuacao_rodada_${RODADA}.png"
          test -s "output/top5_rodada_${RODADA}.png"
          python -m py_compile app/gerar_base_analise_cartola.py
          python -m py_compile app/gerar_video_dialogo_cartola_v4.py
          python -m py_compile app/enviar_video_telegram.py

      - name: Gerar vídeo
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
          VIDEO: ${{ steps.evento.outputs.video }}
          MANIFESTO: ${{ steps.evento.outputs.manifesto }}
        run: |
          set -e
          rm -f "$VIDEO" "$MANIFESTO"
          python app/gerar_video_dialogo_cartola_v4.py \
            --rodada "$RODADA" \
            --repo-root . \
            --output "$VIDEO"
          test -s "$VIDEO"
          test -s "$MANIFESTO"

      - name: Validar vídeo
        env:
          VIDEO: ${{ steps.evento.outputs.video }}
          MANIFESTO: ${{ steps.evento.outputs.manifesto }}
        run: |
          set -e
          DURACAO="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          python - "$DURACAO" "$MANIFESTO" <<'PY'
          import json, sys
          from pathlib import Path
          duration = float(sys.argv[1])
          manifest = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if duration < 480:
              raise SystemExit(f"Vídeo curto demais: {duration:.2f}s")
          if manifest.get("layout_sem_sobreposicao") is not True:
              raise SystemExit("Layout sem sobreposição não confirmado.")
          timeline = manifest.get("timeline") or []
          if not timeline:
              raise SystemExit("Manifesto sem transcrição.")
          unanswered = [item for item in timeline[:-1] if str(item.get("texto_falado", "")).strip().endswith("?")]
          if unanswered:
              print("Perguntas presentes; a sequência seguinte deve conter a resposta correspondente.")
          print(f"Vídeo validado: {duration:.2f}s e {len(timeline)} falas.")
          PY

      - name: Enviar vídeo ao Telegram
        env:
          PLANILHA_ID: ${{ secrets.PLANILHA_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          ABA_TELEGRAM: ${{ secrets.ABA_TELEGRAM }}
          CONTA_TELEGRAM: ${{ secrets.CONTA_TELEGRAM }}
          TELEGRAM_CHAT_FALLBACK: "@dicascartolaportalsimonsports"
        run: |
          python app/enviar_video_telegram.py \
            --video "${{ steps.evento.outputs.video }}" \
            --rodada "${{ steps.evento.outputs.rodada }}" \
            --fase "${{ steps.evento.outputs.fase }}"

      - name: Salvar base e vídeo no repositório
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "data/analise_tecnica_rodada_${{ steps.evento.outputs.rodada }}_v3.json" \
            "${{ steps.evento.outputs.video }}" \
            "${{ steps.evento.outputs.manifesto }}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Vídeo ${{ steps.evento.outputs.fase }} da rodada ${{ steps.evento.outputs.rodada }}"
          enviado=0
          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              enviado=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD
            sleep $((tentativa * 3))
          done
          test "$enviado" -eq 1
