name: Publicar Vídeo Cartola

on:
  repository_dispatch:
    types:
      - cartola_video_analise
  workflow_dispatch:
    inputs:
      rodada:
        description: "Rodada"
        required: true
        default: "23"
      fase:
        description: "INICIAL ou PRE_FECHAMENTO"
        required: true
        default: "INICIAL"

permissions:
  contents: write

concurrency:
  group: publicar-video-cartola-${{ github.event.client_payload.rodada || github.event.inputs.rodada }}-${{ github.event.client_payload.fase || github.event.inputs.fase }}
  cancel-in-progress: false

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install edge-tts Pillow requests google-api-python-client google-auth

      - name: Resolver fase e rodada
        id: evento
        env:
          DISPATCH_RODADA: ${{ github.event.client_payload.rodada }}
          DISPATCH_FASE: ${{ github.event.client_payload.fase }}
          MANUAL_RODADA: ${{ github.event.inputs.rodada }}
          MANUAL_FASE: ${{ github.event.inputs.fase }}
        run: |
          set -e
          RODADA="${DISPATCH_RODADA:-${MANUAL_RODADA:-23}}"
          FASE="${DISPATCH_FASE:-${MANUAL_FASE:-INICIAL}}"
          FASE="$(printf '%s' "$FASE" | tr '[:lower:]' '[:upper:]')"
          case "$FASE" in INICIAL|PRE_FECHAMENTO) ;; *) echo "Fase inválida: $FASE"; exit 1;; esac
          VIDEO="output/analise_$(printf '%s' "$FASE" | tr '[:upper:]' '[:lower:]')_rodada_${RODADA}.mp4"
          MANIFESTO="${VIDEO%.mp4}.json"
          echo "rodada=$RODADA" >> "$GITHUB_OUTPUT"
          echo "fase=$FASE" >> "$GITHUB_OUTPUT"
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
          echo "manifesto=$MANIFESTO" >> "$GITHUB_OUTPUT"

      - name: Validar automação corrigida
        run: |
          set -e
          python -m py_compile app/gerar_base_video_por_snapshot.py
          python -m py_compile app/gerar_base_video_por_fase.py
          python -m py_compile app/gerar_base_video_por_fase_v2.py
          python -m py_compile app/gerar_video_dialogo_cartola_v10.py
          python -m py_compile app/gerar_video_dialogo_cartola_v11.py
          python -m py_compile app/enviar_video_telegram.py

      - name: Recuperar fotografia correta e gerar base
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
          FASE: ${{ steps.evento.outputs.fase }}
        run: |
          set -e
          git fetch --all --prune
          python app/gerar_base_video_por_fase_v2.py \
            --rodada "$RODADA" \
            --fase "$FASE" \
            --repo-root .
          test -s "data/analise_tecnica_rodada_${RODADA}_v3.json"

      - name: Validar fotografia e comparação obrigatória
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
          FASE: ${{ steps.evento.outputs.fase }}
        run: |
          set -e
          python - "$RODADA" "$FASE" <<'PY'
          import json
          import sys
          from pathlib import Path

          rodada = int(sys.argv[1])
          fase = sys.argv[2].upper()
          path = Path(f"data/analise_tecnica_rodada_{rodada}_v3.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("fase_video") != fase:
              raise SystemExit(f"Fase incorreta na base: {data.get('fase_video')}")
          if data.get("fotografia_abertura_preservada") is not True:
              raise SystemExit("Fotografia de abertura não preservada.")
          if fase == "PRE_FECHAMENTO":
              comp = data.get("comparacao_abertura_pre_fechamento") or {}
              if data.get("comparacao_abertura_pre_fechamento_ok") is not True:
                  raise SystemExit("Comparação abertura x pré-fechamento não foi gerada.")
              if comp.get("comparacao_obrigatoria") is not True:
                  raise SystemExit("Comparação obrigatória ausente.")
              if set((comp.get("times") or {}).keys()) != {"economico", "intermediario", "pontuacao"}:
                  raise SystemExit("Comparação dos três modelos incompleta.")
              print("Comparação Abertura x Pré-Fechamento validada.")
          else:
              print("Fotografia de abertura validada.")
          PY

      - name: Enriquecer contexto real
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
        run: |
          set -e
          python app/enriquecer_base_video_cartola_v1.py --rodada "$RODADA" --repo-root .
          test -s "data/analise_tecnica_rodada_${RODADA}_v3.json"

      - name: Validar imagens
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
        run: |
          set -e
          test -s "output/time_economico_rodada_${RODADA}.png"
          test -s "output/time_intermediario_rodada_${RODADA}.png"
          test -s "output/time_pontuacao_rodada_${RODADA}.png"
          test -s "output/top5_rodada_${RODADA}.png"

      - name: Gerar vídeo
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
          FASE: ${{ steps.evento.outputs.fase }}
          VIDEO: ${{ steps.evento.outputs.video }}
          MANIFESTO: ${{ steps.evento.outputs.manifesto }}
        run: |
          set -e
          rm -f "$VIDEO" "$MANIFESTO"
          VIDEO_FASE="$FASE" python app/gerar_video_dialogo_cartola_v11.py \
            --rodada "$RODADA" \
            --repo-root . \
            --output "$VIDEO"
          test -s "$VIDEO"
          test -s "$MANIFESTO"

      - name: Validar vídeo por fase
        env:
          FASE: ${{ steps.evento.outputs.fase }}
          VIDEO: ${{ steps.evento.outputs.video }}
          MANIFESTO: ${{ steps.evento.outputs.manifesto }}
        run: |
          set -e
          DURACAO="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          python - "$DURACAO" "$MANIFESTO" "$FASE" <<'PY'
          import json
          import sys
          from pathlib import Path

          duration = float(sys.argv[1])
          manifest = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          fase = sys.argv[3].upper()
          if duration < 480:
              raise SystemExit(f"Vídeo curto demais: {duration:.2f}s")
          timeline = manifest.get("timeline") or []
          if not timeline:
              raise SystemExit("Manifesto sem transcrição.")
          spoken = " ".join(str(x.get("texto_falado") or "") for x in timeline).lower()
          if fase == "PRE_FECHAMENTO":
              if manifest.get("comparacao_abertura_pre_fechamento_no_audio") is not True:
                  raise SystemExit("Comparação Abertura x Pré-Fechamento não chegou ao áudio.")
              if "abertura" not in spoken or "pré-fechamento" not in spoken:
                  raise SystemExit("Roteiro não compara abertura e pré-fechamento.")
          print(f"Vídeo validado: fase={fase} duração={duration:.2f}s falas={len(timeline)}")
          PY

      - name: Enviar vídeo ao Telegram
        env:
          PLANILHA_ID: "1Lcb6kLFGdMSRNsG_yCCGjToHx2nLk0UaPdvA9Gf8Dx8"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          ABA_TELEGRAM: "Telegram_Cartola"
          CONTA_TELEGRAM: "DICAS CARTOLA PORTAL SIMONSPORTS"
          TELEGRAM_CHAT_FALLBACK: "@dicascartolaportalsimonsports"
        run: |
          set -e
          python app/enviar_video_telegram.py \
            --video "${{ steps.evento.outputs.video }}" \
            --rodada "${{ steps.evento.outputs.rodada }}" \
            --fase "${{ steps.evento.outputs.fase }}"

      - name: Salvar base, manifesto e vídeo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "data/analise_tecnica_rodada_${{ steps.evento.outputs.rodada }}_v3.json" \
            "${{ steps.evento.outputs.video }}" \
            "${{ steps.evento.outputs.manifesto }}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cartola: vídeo ${{ steps.evento.outputs.fase }} R${{ steps.evento.outputs.rodada }} automático"
          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((tentativa * 3))
          done
          exit 1
