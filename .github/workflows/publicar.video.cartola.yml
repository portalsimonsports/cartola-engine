name: Publicar Vídeo Cartola

on:
  repository_dispatch:
    types: [cartola_video_analise]
  workflow_dispatch:
    inputs:
      rodada:
        description: "Rodada"
        required: true
        default: "24"
      fase:
        description: "INICIAL ou PRE_FECHAMENTO"
        required: true
        default: "INICIAL"
  push:
    branches: [main]
    paths:
      - .github/workflows/publicar.video.cartola.yml

permissions:
  contents: write

concurrency:
  group: publicar-video-cartola-${{ github.event.client_payload.rodada || github.event.inputs.rodada || '24' }}-${{ github.event.client_payload.fase || github.event.inputs.fase || 'INICIAL' }}
  cancel-in-progress: false

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install edge-tts Pillow requests google-api-python-client google-auth

      - name: Resolver fase e rodada
        id: evento
        env:
          DISPATCH_RODADA: ${{ github.event.client_payload.rodada }}
          DISPATCH_FASE: ${{ github.event.client_payload.fase }}
          MANUAL_RODADA: ${{ github.event.inputs.rodada }}
          MANUAL_FASE: ${{ github.event.inputs.fase }}
        run: |
          set -e
          RODADA="${DISPATCH_RODADA:-${MANUAL_RODADA:-24}}"
          FASE="${DISPATCH_FASE:-${MANUAL_FASE:-INICIAL}}"
          FASE="$(printf '%s' "$FASE" | tr '[:lower:]' '[:upper:]')"
          case "$FASE" in INICIAL|PRE_FECHAMENTO) ;; *) exit 1;; esac
          VIDEO="output/analise_$(printf '%s' "$FASE" | tr '[:upper:]' '[:lower:]')_rodada_${RODADA}.mp4"
          MANIFESTO="${VIDEO%.mp4}.json"
          if [ "$FASE" = "INICIAL" ]; then FLAG="data/flags/video_inicial_rodada_${RODADA}.publicado.json"; else FLAG="data/flags/video_pre_fechamento_rodada_${RODADA}.publicado.json"; fi
          echo "rodada=$RODADA" >> "$GITHUB_OUTPUT"
          echo "fase=$FASE" >> "$GITHUB_OUTPUT"
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
          echo "manifesto=$MANIFESTO" >> "$GITHUB_OUTPUT"
          echo "flag=$FLAG" >> "$GITHUB_OUTPUT"

      - name: Validar código
        run: |
          set -e
          python -m py_compile app/gerar_base_video_por_fase_v2.py
          python -m py_compile app/gerar_video_dialogo_cartola_v11.py
          python -m py_compile app/enviar_video_telegram.py

      - name: Recuperar snapshot da fase e gerar base
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
          FASE: ${{ steps.evento.outputs.fase }}
        run: |
          set -e
          git fetch --all --prune
          python app/gerar_base_video_por_fase_v2.py --rodada "$RODADA" --fase "$FASE" --repo-root .
          test -s "data/analise_tecnica_rodada_${RODADA}_v3.json"

      - name: Enriquecer contexto real
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
        run: |
          set -e
          python app/enriquecer_base_video_cartola_v1.py --rodada "$RODADA" --repo-root .

      - name: Validar imagens da fase
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
        run: |
          set -e
          test -s "output/time_economico_rodada_${RODADA}.png"
          test -s "output/time_intermediario_rodada_${RODADA}.png"
          test -s "output/time_pontuacao_rodada_${RODADA}.png"
          test -s "output/top5_rodada_${RODADA}.png"

      - name: Gerar vídeo
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
          FASE: ${{ steps.evento.outputs.fase }}
          VIDEO: ${{ steps.evento.outputs.video }}
          MANIFESTO: ${{ steps.evento.outputs.manifesto }}
        run: |
          set -e
          rm -f "$VIDEO" "$MANIFESTO"
          VIDEO_FASE="$FASE" python app/gerar_video_dialogo_cartola_v11.py --rodada "$RODADA" --repo-root . --output "$VIDEO"
          test -s "$VIDEO"
          test -s "$MANIFESTO"
          DURACAO="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          python - "$DURACAO" "$MANIFESTO" "$FASE" <<'PY'
          import json, sys
          from pathlib import Path
          duration=float(sys.argv[1]); manifest=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8')); fase=sys.argv[3]
          if duration < 480: raise SystemExit(f'Vídeo curto: {duration:.2f}s')
          timeline=manifest.get('timeline') or []
          if not timeline: raise SystemExit('Sem transcrição')
          if fase == 'PRE_FECHAMENTO' and manifest.get('comparacao_abertura_pre_fechamento_no_audio') is not True:
              raise SystemExit('Comparação abertura x pré-fechamento ausente do áudio')
          PY

      - name: Enviar vídeo ao Telegram
        env:
          PLANILHA_ID: "1Lcb6kLFGdMSRNsG_yCCGjToHx2nLk0UaPdvA9Gf8Dx8"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          ABA_TELEGRAM: "Telegram_Cartola"
          CONTA_TELEGRAM: "DICAS CARTOLA PORTAL SIMONSPORTS"
          TELEGRAM_CHAT_FALLBACK: "@dicascartolaportalsimonsports"
        run: |
          set -e
          python app/enviar_video_telegram.py --video "${{ steps.evento.outputs.video }}" --rodada "${{ steps.evento.outputs.rodada }}" --fase "${{ steps.evento.outputs.fase }}"

      - name: Registrar sucesso real e salvar artefatos
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
          FASE: ${{ steps.evento.outputs.fase }}
          FLAG: ${{ steps.evento.outputs.flag }}
          VIDEO: ${{ steps.evento.outputs.video }}
          MANIFESTO: ${{ steps.evento.outputs.manifesto }}
        run: |
          set -e
          test -s "$VIDEO"
          test -s "$MANIFESTO"
          mkdir -p "$(dirname "$FLAG")"
          printf '{\n  "rodada": %s,\n  "fase": "%s",\n  "status": "PUBLICADO_COM_SUCESSO",\n  "video": "%s",\n  "registrado_em": "%s"\n}\n' "$RODADA" "$FASE" "$VIDEO" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$FLAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/analise_tecnica_rodada_${RODADA}_v3.json" "$VIDEO" "$MANIFESTO" "$FLAG"
          git commit -m "Cartola: vídeo ${FASE} R${RODADA} publicado com sucesso"
          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((tentativa * 3))
          done
          exit 1

