name: Publicar Vídeo Cartola

on:
  repository_dispatch:
    types:
      - cartola_video_analise
  workflow_dispatch:
    inputs:
      rodada:
        description: "Rodada"
        required: true
        default: "22"
      fase:
        description: "INICIAL ou PRE_FECHAMENTO"
        required: true
        default: "INICIAL"

permissions:
  contents: write

concurrency:
  group: publicar-video-cartola-${{ github.event.client_payload.rodada || github.event.inputs.rodada }}-${{ github.event.client_payload.fase || github.event.inputs.fase }}
  cancel-in-progress: false

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install edge-tts Pillow requests google-api-python-client google-auth

      - name: Resolver evento
        id: evento
        env:
          DISPATCH_RODADA: ${{ github.event.client_payload.rodada }}
          DISPATCH_FASE: ${{ github.event.client_payload.fase }}
          MANUAL_RODADA: ${{ github.event.inputs.rodada }}
          MANUAL_FASE: ${{ github.event.inputs.fase }}
        run: |
          set -e
          RODADA="${DISPATCH_RODADA:-${MANUAL_RODADA:-22}}"
          FASE="${DISPATCH_FASE:-${MANUAL_FASE:-INICIAL}}"
          FASE="$(printf '%s' "$FASE" | tr '[:lower:]' '[:upper:]')"
          case "$FASE" in INICIAL|PRE_FECHAMENTO) ;; *) echo "Fase inválida: $FASE"; exit 1;; esac
          VIDEO="output/analise_$(printf '%s' "$FASE" | tr '[:upper:]' '[:lower:]')_rodada_${RODADA}.mp4"
          MANIFESTO="${VIDEO%.mp4}.json"
          echo "rodada=$RODADA" >> "$GITHUB_OUTPUT"
          echo "fase=$FASE" >> "$GITHUB_OUTPUT"
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
          echo "manifesto=$MANIFESTO" >> "$GITHUB_OUTPUT"

      - name: Validar snapshots publicados
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
        run: |
          set -e
          test -s "data/publicacoes_atuais/time_economico_rodada_${RODADA}.json"
          test -s "data/publicacoes_atuais/time_intermediario_rodada_${RODADA}.json"
          test -s "data/publicacoes_atuais/time_pontuacao_rodada_${RODADA}.json"
          test -s "data/publicacoes_atuais/top5_rodada_${RODADA}.json"
          python - "$RODADA" <<'PY'
          import json, sys
          from pathlib import Path
          rodada = int(sys.argv[1])
          nomes = ['time_economico', 'time_intermediario', 'time_pontuacao', 'top5']
          for nome in nomes:
              path = Path(f'data/publicacoes_atuais/{nome}_rodada_{rodada}.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              if int(data.get('rodada', 0)) != rodada:
                  raise SystemExit(f'{path}: rodada incorreta')
              if str(data.get('evento_programado', '')).upper() != 'SELECAO_INICIAL':
                  raise SystemExit(f'{path}: não é snapshot da SELECAO_INICIAL')
              print(f'Snapshot validado: {path}')
          PY

      - name: Gerar base pelos snapshots publicados
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
        run: |
          set -e
          python app/gerar_base_video_por_snapshot.py --rodada "$RODADA" --repo-root .
          test -s "data/analise_tecnica_rodada_${RODADA}_v3.json"

      - name: Enriquecer classificação forma e desempenho reais
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
        run: |
          set -e
          python app/enriquecer_base_video_cartola_v1.py --rodada "$RODADA" --repo-root .
          python - "$RODADA" <<'PY'
          import json, sys
          from pathlib import Path

          rodada = int(sys.argv[1])
          path = Path(f'data/analise_tecnica_rodada_{rodada}_v3.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          if data.get('contexto_real_validado') is not True:
              raise SystemExit('Contexto real não validado.')

          jogos = data.get('jogos') or []
          if len(jogos) != 10:
              raise SystemExit(f'Quantidade de jogos inválida: {len(jogos)}')

          for jogo in jogos:
              if int(jogo.get('pos_mandante') or 0) <= 0:
                  raise SystemExit(f"Posição inválida: {jogo.get('mandante')}")
              if int(jogo.get('pos_visitante') or 0) <= 0:
                  raise SystemExit(f"Posição inválida: {jogo.get('visitante')}")
              if jogo.get('mandante') == jogo.get('mandante_sigla'):
                  raise SystemExit(f"Nome completo ausente: {jogo.get('mandante')}")
              if jogo.get('visitante') == jogo.get('visitante_sigla'):
                  raise SystemExit(f"Nome completo ausente: {jogo.get('visitante')}")
              if len(str(jogo.get('forma_mandante') or '').split()) < 3:
                  raise SystemExit(f"Forma inválida: {jogo.get('mandante')}")
              if len(str(jogo.get('forma_visitante') or '').split()) < 3:
                  raise SystemExit(f"Forma inválida: {jogo.get('visitante')}")

          print('Base real validada: nomes completos, classificação e forma recente.')
          PY

      - name: Validar imagens e geradores V6
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
        run: |
          set -e
          test -s "output/time_economico_rodada_${RODADA}.png"
          test -s "output/time_intermediario_rodada_${RODADA}.png"
          test -s "output/time_pontuacao_rodada_${RODADA}.png"
          test -s "output/top5_rodada_${RODADA}.png"
          python -m py_compile app/gerar_base_video_por_snapshot.py
          python -m py_compile app/enriquecer_base_video_cartola_v1.py
          python -m py_compile app/gerar_video_dialogo_cartola_v4.py
          python -m py_compile app/gerar_video_dialogo_cartola_v6.py
          python -m py_compile app/enviar_video_telegram.py

      - name: Gerar vídeo V6 com contexto real
        env:
          RODADA: ${{ steps.evento.outputs.rodada }}
          VIDEO: ${{ steps.evento.outputs.video }}
          MANIFESTO: ${{ steps.evento.outputs.manifesto }}
        run: |
          set -e
          rm -f "$VIDEO" "$MANIFESTO"
          python app/gerar_video_dialogo_cartola_v6.py \
            --rodada "$RODADA" \
            --repo-root . \
            --output "$VIDEO"
          test -s "$VIDEO"
          test -s "$MANIFESTO"

      - name: Validar vídeo e bloquear dados falsos
        env:
          VIDEO: ${{ steps.evento.outputs.video }}
          MANIFESTO: ${{ steps.evento.outputs.manifesto }}
        run: |
          set -e
          DURACAO="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
          python - "$DURACAO" "$MANIFESTO" <<'PY'
          import json
          import sys
          import unicodedata
          from pathlib import Path

          duration = float(sys.argv[1])
          manifest = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))

          if duration < 480:
              raise SystemExit(f'Vídeo curto demais: {duration:.2f}s')
          if manifest.get('layout_sem_sobreposicao') is not True:
              raise SystemExit('Layout sem sobreposição não confirmado.')
          if manifest.get('contexto_real_validado') is not True:
              raise SystemExit('Manifesto sem confirmação do contexto real.')
          if manifest.get('zero_colocado_bloqueado') is not True:
              raise SystemExit('Bloqueio de zero colocado não confirmado.')

          timeline = manifest.get('timeline') or []
          if not timeline:
              raise SystemExit('Manifesto sem transcrição.')

          falas = ' '.join(str(item.get('texto_falado', '')) for item in timeline).lower()
          telas = ' '.join(str(item.get('texto_tela', '')) for item in timeline).lower()
          conteudo = falas + ' ' + telas
          sem_acento = ''.join(
              char for char in unicodedata.normalize('NFD', conteudo)
              if unicodedata.category(char) != 'Mn'
          )

          proibidos = [
              '0º colocado',
              '0o colocado',
              'recorte histórico preservado',
              'recorte historico preservado',
              'fora do snapshot',
              'sem dados',
              'sem dado',
          ]
          encontrados_proibidos = [
              termo for termo in proibidos
              if termo in conteudo or termo in sem_acento
          ]
          if encontrados_proibidos:
              raise SystemExit(
                  'Vídeo bloqueado por conteúdo provisório ou inválido: '
                  + ', '.join(encontrados_proibidos)
              )

          obrigatorios = {
              'classificação real': ['ocupa a', 'colocado da competição', 'posição'],
              'forma recente': ['últimos 5 jogos', 'ultimos 5 jogos', 'forma recente'],
              'desempenho do atleta': ['média de', 'media de', 'última pontuação', 'ultima pontuacao'],
              'valor': ['cartoletas', 'custa'],
              'nomes completos': ['grêmio', 'gremio', 'são paulo', 'sao paulo'],
          }
          ausentes = [
              grupo
              for grupo, termos in obrigatorios.items()
              if not any(termo in conteudo or termo in sem_acento for termo in termos)
          ]
          if ausentes:
              raise SystemExit('Vídeo incompleto; grupos ausentes: ' + ', '.join(ausentes))

          print(
              f'Vídeo V6 validado: {duration:.2f}s, {len(timeline)} falas, '
              'sem zero colocado e sem texto provisório.'
          )
          PY

      - name: Enviar vídeo ao Telegram
        env:
          PLANILHA_ID: "1Lcb6kLFGdMSRNsG_yCCGjToHx2nLk0UaPdvA9Gf8Dx8"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          ABA_TELEGRAM: "Telegram_Cartola"
          CONTA_TELEGRAM: "DICAS CARTOLA PORTAL SIMONSPORTS"
          TELEGRAM_CHAT_FALLBACK: "@dicascartolaportalsimonsports"
        run: |
          set -e
          python app/enviar_video_telegram.py \
            --video "${{ steps.evento.outputs.video }}" \
            --rodada "${{ steps.evento.outputs.rodada }}" \
            --fase "${{ steps.evento.outputs.fase }}"

      - name: Salvar base e vídeo no repositório
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "data/analise_tecnica_rodada_${{ steps.evento.outputs.rodada }}_v3.json" \
            "${{ steps.evento.outputs.video }}" \
            "${{ steps.evento.outputs.manifesto }}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Vídeo V6 ${{ steps.evento.outputs.fase }} da rodada ${{ steps.evento.outputs.rodada }}"
          enviado=0
          for tentativa in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              enviado=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD
            sleep $((tentativa * 3))
          done
          test "$enviado" -eq 1
